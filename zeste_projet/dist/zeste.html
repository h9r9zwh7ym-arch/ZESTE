.lg:active{transform:scale(.94)}
.lg-i{height:52px;width:52px;display:grid;place-items:center}.lg-i svg{height:100%;width:auto}
.lg b{font-size:12.5px;font-weight:700}
.lg span{font-size:11.5px;color:var(--label2);font-family:var(--rounded)}
.lg.on{box-shadow:inset 0 0 0 2px var(--tint),var(--shadow);background:var(--tint-bg)}
.lg em{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;font-weight:700;background:var(--green);color:#fff;border-radius:8px;padding:1px 6px;white-space:nowrap}
.lab-shelf{padding-top:4px;padding-bottom:10px}
.shelf{flex:none;width:76px;min-height:104px;padding:8px 4px;border-radius:16px;background:var(--bg2);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;transition:transform .2s cubic-bezier(.3,1.3,.5,1)}
.shelf .sh-b{height:48px;width:30px;display:grid}.shelf .sh-b svg{width:100%;height:100%}
.shelf .sh-ic{width:34px;height:34px;border-radius:17px;margin:7px 0 7px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.shelf .sh-plus{width:40px;height:40px;border-radius:20px;background:var(--tint-bg);color:var(--tint);display:grid;place-items:center;margin:4px 0 8px}.shelf .sh-plus svg{width:22px;height:22px}
.shelf .sh-n{font-size:11.5px;font-weight:600;line-height:1.15;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.shelf .sh-q{position:absolute;top:-6px;right:-4px;font-size:10.5px;font-weight:800;font-family:var(--rounded);background:var(--tint);color:var(--on-tint);border-radius:9px;padding:2px 6px}
.shelf.in{box-shadow:inset 0 0 0 1.5px var(--tint),var(--shadow)}
.shelf.pour .sh-b{animation:bpour .55s cubic-bezier(.3,1.2,.5,1)}
@keyframes bpour{0%{transform:none}40%{transform:rotate(-38deg) translateY(-6px)}100%{transform:none}}
.lab-ice{margin-top:8px}
.lab-gars{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;margin:0 16px}
.lgar{display:flex;align-items:center;gap:6px;height:44px;padding:0 10px;border-radius:14px;background:var(--bg2);box-shadow:var(--shadow);text-align:left;transition:transform .2s cubic-bezier(.3,1.4,.5,1),background .2s}
.lgar span{font-size:20px;flex:none;transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
.lgar b{font-size:12.5px;font-weight:600;line-height:1.1}
.lgar.on{background:var(--tint-bg);box-shadow:inset 0 0 0 2px var(--tint)}
.lgar.on span{transform:scale(1.18) rotate(-8deg)}
.lgar.sug{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--green) 60%,transparent),var(--shadow)}
.lgar:active{transform:scale(.93)}
.lab-tips .tip-r{display:flex;gap:12px;padding:12px 16px;align-items:flex-start;position:relative}
.lab-tips .tip-r+.tip-r::before{content:"";position:absolute;top:0;left:48px;right:0;height:.5px;background:var(--sep)}
.tip-r>svg{width:22px;height:22px;flex:none;color:var(--tint);margin-top:1px}
.tip-r:has(>svg circle) >svg{color:var(--orange)}
.tip-r.bad>svg{color:var(--red)}
.tip-r b{display:block;font-size:15.5px}
.tip-r span{display:block;font-size:14px;color:var(--label2);margin:2px 0 8px}
.lab-serve{height:58px;font-size:19px;border-radius:18px;box-shadow:0 8px 22px color-mix(in srgb,var(--tint) 35%,transparent)}
.lab-more{margin:18px 0 0}
.lab-more summary{list-style:none;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--tint);font-weight:600;font-size:16px;padding:8px;cursor:pointer}
.lab-more summary::-webkit-details-marker{display:none}
.lab-more summary .chev{transition:transform .25s;color:var(--tint)}
.lab-more[open] summary .chev{transform:rotate(90deg)}
.lab-start{text-align:center}.lab-start b{display:block;font-family:var(--serif);font-size:19px}.lab-start span{font-size:14px;color:var(--label2)}
/* animations du labo */
svg .liq.rise{animation:rise .7s cubic-bezier(.25,.8,.3,1) both!important}
@keyframes rise{from{transform:translateY(var(--from))}to{transform:none}}
.lab-stage.shake-no .lab-glass{animation:nope .5s cubic-bezier(.3,1.5,.5,1)}
.lab-stage.shake-no .lab-gbar i{background:var(--red)}
@keyframes nope{0%,100%{transform:none}20%{transform:translateX(-10px) rotate(-3deg)}40%{transform:translateX(9px) rotate(3deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.lab-stage.serving.shake .lab-glass svg{opacity:.15;transition:opacity .3s}
.lab-tool .shaker{width:110px;height:110px;color:var(--tint);animation:shaking .16s ease-in-out infinite alternate;filter:drop-shadow(0 10px 18px rgba(0,0,0,.2))}
.lab-tool .shaker svg{width:100%;height:100%}
@keyframes shaking{from{transform:translate(-8px,-6px) rotate(-18deg)}to{transform:translate(8px,6px) rotate(18deg)}}
.lab-tool .spoon{position:absolute;left:50%;top:14%;width:4px;height:150px;margin-left:-2px;border-radius:2px;background:linear-gradient(var(--label3),var(--label2));transform-origin:50% 100%;animation:stirr 0.45s ease-in-out infinite alternate}
@keyframes stirr{from{transform:translateX(-14px) rotate(-8deg)}to{transform:translateX(14px) rotate(8deg)}}
.lab-stage.serving.stir .lab-glass svg{animation:jig .9s ease-in-out}
@media (prefers-reduced-motion:reduce){.lab-tool *{animation:none!important}}

/* ===== Fenêtre de service du labo ===== */
#serve{position:fixed;inset:0;z-index:270;color:#fff;opacity:0;transition:opacity .35s;overflow-y:auto;-webkit-overflow-scrolling:touch}
#serve.open{opacity:1}
#serve.closing{opacity:0}
.sv-bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 26%,color-mix(in srgb,var(--c) 75%,#3A1A40) 0%,color-mix(in srgb,var(--c) 25%,#1A0E20) 45%,#0E0A12 85%)}
.sv-bg::before,.sv-bg::after{content:"";position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(40px);opacity:.35;animation:svblob 9s ease-in-out infinite}
.sv-bg::before{left:-25vmax;top:-10vmax;background:color-mix(in srgb,var(--c) 80%,#FF9F0A)}
.sv-bg::after{right:-25vmax;bottom:-15vmax;background:color-mix(in srgb,var(--c) 60%,#5E5CE6);animation-delay:-4.5s}
@keyframes svblob{0%,100%{transform:translate(0,0)}50%{transform:translate(6vmax,4vmax)}}
.sv-x{position:fixed!important;top:calc(env(safe-area-inset-top,0px) + 10px);right:14px;background:rgba(255,255,255,.18)!important;color:#fff!important;z-index:3}
.sv-in{position:relative;z-index:2;min-height:100%;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 54px) 22px calc(env(safe-area-inset-bottom,0px) + 24px);text-align:center}
.sv-kick{font-size:17px;font-weight:700;opacity:.85;min-height:24px;animation:vin .5s both}
.sv-glass{position:relative;height:230px;width:100%;display:grid;place-items:center;margin:8px 0 6px}
.sv-g{position:relative;height:100%;opacity:0;transition:opacity .45s ease;--glass-stroke:rgba(255,245,230,.75);--glass-fill:rgba(255,255,255,.08)}
.sv-g::before{content:"";position:absolute;left:50%;bottom:4%;width:170px;height:40px;margin-left:-85px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.35),transparent)}
.sv-g svg{position:relative;height:100%;width:auto}
#serve.p2 .sv-g{opacity:1}
.sv-tool{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;transition:opacity .35s,transform .45s cubic-bezier(.5,0,.75,0)}
#serve.p2 .sv-tool{opacity:0;transform:translateY(-60px) scale(.6)}
.sv-shaker{width:140px;height:140px;color:#fff;animation:shaking .15s ease-in-out infinite alternate;filter:drop-shadow(0 14px 22px rgba(0,0,0,.35))}
.sv-shaker svg{width:100%;height:100%}
.sv-spoon{position:relative;width:120px;height:160px;border-radius:0 0 30px 30px;border:3px solid rgba(255,255,255,.7);border-top:0}
.sv-spoon i{position:absolute;left:50%;top:-30px;width:5px;height:180px;margin-left:-2.5px;border-radius:3px;background:#fff;transform-origin:50% 100%;animation:stirr .4s ease-in-out infinite alternate}
.sv-res{display:flex;align-items:center;gap:18px;margin-top:4px;opacity:0;transform:translateY(20px);transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.2,1)}
#serve.p3 .sv-res{opacity:1;transform:none}
.sv-ring{position:relative;width:120px;height:120px;flex:none}
.sv-ring svg{width:100%;height:100%}
.sv-num{position:absolute;inset:0;display:flex;align-items:baseline;justify-content:center;padding-top:36px}
.sv-num b{font-family:var(--rounded);font-size:40px;font-weight:800;line-height:1}
.sv-num span{font-family:var(--rounded);font-size:14px;font-weight:700;opacity:.75}
.sv-grade{text-align:left;opacity:0;transform:scale(.8);transition:opacity .4s,transform .5s cubic-bezier(.3,1.7,.5,1)}
#serve.p5 .sv-grade{opacity:1;transform:none}
.sv-e{font-size:40px;display:block;line-height:1.1}
.sv-grade b{display:block;font-family:var(--serif);font-size:24px;line-height:1.15;max-width:170px}
.sv-grade em{display:inline-block;margin-top:6px;font-style:normal;font-size:12px;font-weight:800;background:#fff;color:#1A1020;border-radius:10px;padding:3px 9px;animation:spop .5s cubic-bezier(.3,1.8,.5,1) .3s both}
.sv-goals{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:380px;margin-top:22px}
.sv-goal{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.1);text-align:left;opacity:0;transform:translateY(14px) scale(.95);transition:opacity .4s calc(var(--i)*110ms),transform .5s cubic-bezier(.3,1.5,.5,1) calc(var(--i)*110ms)}
#serve.p4 .sv-goal{opacity:1;transform:none}
.sv-gi{width:24px;height:24px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:800;font-size:13px}
.sv-gi svg{width:14px;height:14px}
.sv-goal.ok .sv-gi{background:#30D158;color:#fff}.sv-goal.mid .sv-gi{background:#FF9F0A;color:#fff}.sv-goal.ko .sv-gi{background:#FF453A;color:#fff}
.sv-goal b{display:block;font-size:14px}
.sv-goal i{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.18);margin-top:5px;overflow:hidden}
.sv-goal u{display:block;height:100%;width:0;border-radius:3px;background:#fff;transition:width .8s cubic-bezier(.2,.8,.2,1) calc(var(--i)*110ms + .2s)}
#serve.p4 .sv-goal u{width:var(--w)}
.sv-sum{font-size:15px;opacity:0;margin:16px 0 0;max-width:340px;line-height:1.4;transition:opacity .5s .2s}
#serve.p5 .sv-sum{opacity:.85}
.sv-actions{width:100%;max-width:380px;margin-top:20px;display:flex;flex-direction:column;gap:10px;opacity:0;transform:translateY(16px);transition:opacity .5s .3s,transform .5s .3s}
#serve.p5 .sv-actions{opacity:1;transform:none}
.sv-row{display:flex;gap:10px}.sv-row .btn{flex:1}
.sv-btn{background:#fff!important;color:#1A1020!important;height:54px}
.sv-btn2{background:rgba(255,255,255,.16)!important;color:#fff!important}
#serve.skip *{transition-delay:0s!important}
.roul .rg{background:none;border:0;cursor:pointer}
.roul .rn{background:none;border:0;color:var(--label);cursor:pointer}
.rl-pills{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px;animation:vin .5s both}
.rl-pills .pill.ok{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.rl-ing{font-size:14px;color:var(--label2);margin-top:8px;animation:vin .5s .08s both}
.rl-more{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:16px;margin-top:12px;animation:vin .5s .15s both}
.rl-more .chev{color:var(--tint)}
.guide{padding:16px}
.gd-top{font-size:16px;line-height:1.4;margin-bottom:14px}
.gd-bar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin-bottom:6px}
.gd-bar i{display:block;height:100%;transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.gd-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:.5px solid var(--sep)}
.gd-row:last-of-type{border-bottom:0}
.gd-dot{width:12px;height:12px;border-radius:6px;flex:none}
.gd-row b{display:block;font-size:16px}
.gd-row span{display:block;font-size:13px;color:var(--label2);line-height:1.3;margin-top:1px}
.gd-row em{font-style:normal;font-family:var(--rounded);font-weight:800;font-size:18px;flex:none}
.gd-src{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px;font-size:13px;color:var(--label2)}
.gd-src i{font-style:normal;background:var(--fill2);border-radius:10px;padding:3px 9px;color:var(--label);font-weight:600}
.gd-foot{font-size:12.5px;color:var(--label2);margin-top:10px}
.sv-goal .grow{flex:1;min-width:0}
.sv-num{padding-top:38px}.sv-num b{font-size:36px}
/* remuer : verre à mélange, cuillère qui tourne, glaçons qui suivent (aucun changement de taille) */
.sv-mix{position:relative;width:118px;height:150px;border:3px solid rgba(255,255,255,.75);border-top:0;border-radius:4px 4px 26px 26px;display:block}
.sv-liq{position:absolute;left:3px;right:3px;bottom:3px;height:62%;border-radius:2px 2px 22px 22px;background:linear-gradient(180deg,color-mix(in srgb,var(--lc) 70%,#fff),var(--lc));opacity:.9;overflow:hidden}
.sv-liq b{position:absolute;top:18%;width:24px;height:22px;border-radius:5px;background:rgba(255,255,255,.35);border:1.5px solid rgba(255,255,255,.7);animation:orbit 1.1s linear infinite}
.sv-liq .c1{left:12px}.sv-liq .c2{left:44px;top:42%;animation-delay:-.37s}.sv-liq .c3{left:70px;top:22%;animation-delay:-.73s}
@keyframes orbit{0%{transform:translateX(0) rotate(0)}25%{transform:translateX(18px) rotate(20deg)}50%{transform:translateX(0) rotate(0)}75%{transform:translateX(-18px) rotate(-20deg)}100%{transform:translateX(0) rotate(0)}}
.sv-sp{position:absolute;left:50%;top:-44px;width:5px;height:176px;margin-left:-2.5px;border-radius:3px;background:linear-gradient(#fff,rgba(255,255,255,.75));transform-origin:50% 15%;animation:spoonturn 1.1s linear infinite}
.sv-sp::after{content:"";position:absolute;left:-4px;bottom:-4px;width:13px;height:8px;border-radius:50%;background:#fff}
@keyframes spoonturn{0%{transform:translateX(0) rotate(0)}25%{transform:translateX(24px) rotate(-5deg)}50%{transform:translateX(0) rotate(0)}75%{transform:translateX(-24px) rotate(5deg)}100%{transform:translateX(0) rotate(0)}}
.timer.run .shk.stir{animation:spoonturn 1.1s linear infinite;transform-origin:50% 20%}

/* ===== Trophées ===== */
.trophies{grid-template-columns:repeat(3,1fr);gap:10px}
.trophy{display:flex;flex-direction:column;align-items:center;padding:12px 6px 10px;border-radius:18px;transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.trophy:active{transform:scale(.94)}
.trophy svg.medal{width:62px;height:68px}
.trophy .tn{font-size:12.5px;font-weight:700;margin-top:4px;line-height:1.2}
.trophy .tp{font-size:11px;color:var(--label2);margin-top:2px;font-family:var(--rounded);font-weight:600}
.trophy.locked svg{opacity:1}
.trophy.locked .tn{color:var(--label2)}
svg.medal.on{animation:mdfloat 4s ease-in-out infinite}
.trophies .trophy:nth-child(3n+2) svg.medal.on{animation-delay:-1.3s}.trophies .trophy:nth-child(3n) svg.medal.on{animation-delay:-2.6s}
@keyframes mdfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.md-shine{animation:mdshine 5s ease-in-out infinite}
.trophies .trophy:nth-child(2n) .md-shine{animation-delay:-2.2s}
@keyframes mdshine{0%,70%{transform:translateX(0) skewX(-20deg)}100%{transform:translateX(130px) skewX(-20deg)}}
svg.medal.t-plat.on{filter:drop-shadow(0 0 6px rgba(140,200,255,.55))}
svg.medal.t-plat.on circle:nth-of-type(1){animation:iris 6s linear infinite}
@keyframes iris{0%,100%{filter:hue-rotate(-25deg)}50%{filter:hue-rotate(35deg)}}
svg.medal.t-gold.on{filter:drop-shadow(0 2px 6px rgba(242,182,50,.45))}
.tro-tiers{display:flex;flex-wrap:wrap;gap:6px;margin:0 16px 12px}
.tt{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;background:var(--fill2);font-size:12.5px;font-weight:700;color:var(--label2);font-family:var(--rounded)}
.tt i{width:12px;height:12px;border-radius:6px;display:block}
/* scène de déblocage */
.tro-pop{position:fixed;inset:0;z-index:290;display:grid;place-items:center;opacity:0;transition:opacity .35s;color:#fff;text-align:center}
.tro-pop.open{opacity:1}.tro-pop.out{opacity:0}
.tp-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--tc) 55%,#1A1020) 0%,rgba(10,6,14,.92) 62%)}
.tp-rays{position:absolute;left:50%;top:42%;width:720px;height:720px;margin:-360px 0 0 -360px;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.14) 0 8deg,transparent 8deg 22deg);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 0%,transparent 62%);mask:radial-gradient(circle,#000 0%,transparent 62%);animation:spin 18s linear infinite;opacity:0;transition:opacity .8s .3s}
.tro-pop.open .tp-rays{opacity:1}
.tp-in{position:relative;padding:0 30px}
.tp-k{font-size:15px;font-weight:800;letter-spacing:.02em;opacity:0;animation:vin .5s .15s both}
.tp-m{width:190px;height:209px;margin:14px auto 6px;perspective:600px}
.tp-m svg{width:100%;height:100%;animation:medalin 1.1s cubic-bezier(.2,.9,.3,1.15) .1s both;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45))}
@keyframes medalin{0%{transform:scale(.2) rotateY(-540deg) translateY(-80px);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
.tp-tier{display:inline-block;font-size:12px;font-weight:800;border-radius:11px;padding:4px 11px;background:#fff;color:#1A1020;animation:spop .5s cubic-bezier(.3,1.8,.5,1) .9s both}
.tp-n{font-family:var(--serif);font-size:32px;font-weight:700;margin-top:10px;animation:vin .5s 1s both}
.tp-d{font-size:16px;opacity:.85;margin-top:4px;animation:vin .5s 1.1s both}
.tp-tap{font-size:13px;opacity:.6;margin-top:26px;animation:vin .5s 1.6s both}
.t-plat .tp-tier{background:linear-gradient(90deg,#DDF2FF,#E8DDFF,#DDFFF2);animation:spop .5s cubic-bezier(.3,1.8,.5,1) .9s both}
/* fiche d'un trophée */
.ts-hero{position:relative;text-align:center;padding:0 24px 8px;overflow:hidden}
.ts-rays{position:absolute;left:50%;top:95px;width:520px;height:520px;margin:-260px 0 0 -260px;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--tint) 16%,transparent) 0 8deg,transparent 8deg 22deg);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 0%,transparent 60%);mask:radial-gradient(circle,#000 0%,transparent 60%);animation:spin 20s linear infinite;opacity:0}
.ts-hero.on .ts-rays{opacity:1}
.ts-m{position:relative;width:150px;height:165px;margin:4px auto 8px;perspective:600px}
.ts-m svg{width:100%;height:100%;animation:medalin .9s cubic-bezier(.2,.9,.3,1.15) both}
.ts-hero h1{position:relative;font-family:var(--serif);font-size:28px;margin:10px 0 4px}
.ts-hero p{position:relative;margin:0;color:var(--label2);font-size:16px}
.ts-hero .tp-tier{position:relative;background:var(--fill);color:var(--label);animation:none}
.ts-done{display:flex;align-items:center;gap:10px;color:var(--green);font-weight:700}
.ts-done svg{width:24px;height:24px}.ts-done span{color:var(--label)}
.ts-prog{display:flex;align-items:center;gap:12px}
.ts-bar{flex:1;height:10px;border-radius:5px;background:var(--fill);overflow:hidden}
.ts-bar i{display:block;height:100%;border-radius:5px;background:var(--tint);transform-origin:left;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
.ts-prog span{font-family:var(--rounded);font-weight:700;font-size:15px}

/* ===== EXPLORER ===== */
.c-modes button{font-size:13px}
/* monde */
.world{margin:0 16px;border-radius:20px;overflow:hidden;background:var(--bg2);box-shadow:var(--shadow)}
.world svg{display:block;width:100%;height:auto;aspect-ratio:360/150;touch-action:manipulation}
.world .sea{fill:color-mix(in srgb,#3A8AC0 10%,var(--bg2))}
.world .grat path{stroke:var(--sep);stroke-width:.15;fill:none}
.world .land{fill:color-mix(in srgb,var(--tint) 16%,var(--bg3));stroke:color-mix(in srgb,var(--tint) 30%,transparent);stroke-width:.25}
.pin{cursor:pointer}
.pin.drop{animation:pindrop .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pindrop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.pin-dot{fill:var(--tint);stroke:#fff;stroke-width:.35}
.pin.made .pin-dot{fill:#E0303A}
.pin-pulse{fill:var(--tint);opacity:.25;transform-box:fill-box;transform-origin:center;animation:pinpulse 2.6s ease-out infinite}
@keyframes pinpulse{0%{opacity:.35;transform:scale(.6)}100%{opacity:0;transform:scale(1.6)}}
.pin-t{fill:var(--label);font-weight:700;font-family:var(--sans);paint-order:stroke;stroke:var(--bg2);stroke-width:.35}
.city-hero{text-align:center;padding:0 24px}
.city-pin{width:56px;height:56px;border-radius:28px;background:var(--tint);color:var(--on-tint);display:grid;place-items:center;margin:0 auto 8px;animation:spop .6s cubic-bezier(.3,1.8,.5,1)}
.city-pin svg{width:28px;height:28px}
.city-hero h1{font-family:var(--serif);font-size:30px;margin:4px 0 6px}
.city-hero p{margin:0;color:var(--label2);font-size:16px}
/* lignées */
.lin-chips{margin-bottom:10px}
.lin-card{padding:12px 16px}.lin-card b{display:block;font-family:var(--serif);font-size:19px}.lin-card span{font-size:14px;color:var(--label2)}
.tree-wrap{overflow-x:auto;margin-top:12px;padding:6px 16px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tree-wrap::-webkit-scrollbar{display:none}
.tree{position:relative;margin:0 auto}
.tree-links{position:absolute;inset:0;overflow:visible}
.tree-links path{fill:none;stroke:color-mix(in srgb,var(--tint) 55%,transparent);stroke-width:2;stroke-dasharray:100;stroke-dashoffset:100;animation:treeline .7s ease forwards}
@keyframes treeline{to{stroke-dashoffset:0}}
.tnode{position:absolute;width:92px;height:86px;border-radius:16px;background:var(--bg2);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 4px 4px;animation:tnodein .55s cubic-bezier(.3,1.5,.5,1) both;transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.tnode:active{transform:scale(.93)}
@keyframes tnodein{from{opacity:0;transform:translateY(-12px) scale(.85)}to{opacity:1;transform:none}}
.tnode .tg{width:30px;height:38px;display:grid}.tnode .tg svg{width:100%;height:100%}
.tnode b{font-family:var(--serif);font-size:11.5px;line-height:1.15;text-align:center;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tnode i{font-style:normal;font-family:var(--rounded);font-size:10px;font-weight:700;color:var(--tint);margin-top:auto}
.tnode.made{box-shadow:inset 0 0 0 2px #E8B040,var(--shadow)}
.tnode.ok::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:4px;background:var(--green)}
/* radar inversé */
.rad-card{display:flex;justify-content:center;padding:10px}
.rad-edit{width:100%;max-width:330px;height:auto;touch-action:none;overflow:visible}
.rad-ring{fill:none;stroke:var(--sep)}
.rad-ax{stroke:var(--sep)}
.rad-lab{font-size:12px;fill:var(--label2);font-weight:700;font-family:var(--sans)}
.rad-poly{fill:color-mix(in srgb,var(--tint) 24%,transparent);stroke:var(--tint);stroke-width:2.5;stroke-linejoin:round;transition:points .1s}
.rad-h{fill:var(--bg2);stroke:var(--tint);stroke-width:3;cursor:grab;transition:r .2s}
.rad-h.drag{r:15;fill:var(--tint)}
/* étagère */
.bar-shelves{position:relative;margin:0 16px;padding:16px 10px 6px;border-radius:22px;background:linear-gradient(180deg,#2A1C12,#1A120C);box-shadow:inset 0 0 0 .5px rgba(255,220,180,.08),0 10px 30px rgba(0,0,0,.18);overflow:hidden}
.bar-lamp{position:absolute;left:10%;right:10%;top:-80px;height:170px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,196,120,.38),transparent);pointer-events:none;animation:lamp 6s ease-in-out infinite}
@keyframes lamp{0%,100%{opacity:.85}50%{opacity:1}}
.shelf-row{position:relative;margin-bottom:18px}
.shelf-lab{font-size:11.5px;font-weight:800;color:rgba(255,225,190,.7);margin:0 6px 4px;letter-spacing:.02em}
.shelf-bottles{display:flex;gap:4px;overflow-x:auto;padding:4px 4px 0;scrollbar-width:none;align-items:flex-end;min-height:108px}
.shelf-bottles::-webkit-scrollbar{display:none}
.sbottle{flex:none;width:58px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;animation:bdrop .6s cubic-bezier(.3,1.5,.5,1) both;transition:transform .25s cubic-bezier(.3,1.5,.5,1);--glass-stroke:rgba(255,240,220,.55);--glass-fill:rgba(255,240,220,.08);--label3:rgba(255,230,200,.4)}
.sbottle svg{width:44px;height:74px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
.sbottle span{font-size:10.5px;font-weight:600;color:rgba(255,235,210,.85);text-align:center;line-height:1.1;height:24px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sbottle:active{transform:translateY(-10px) rotate(-4deg)}
.sbottle.empty svg{opacity:.45}
.sbottle em{position:absolute;top:24px;font-style:normal;font-size:9px;font-weight:800;background:#FF453A;color:#fff;border-radius:6px;padding:1px 4px}
@keyframes bdrop{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}
.shelf-board{height:12px;margin:-2px 0 0;border-radius:3px;background:linear-gradient(180deg,#8A5A32,#5A3820);box-shadow:0 6px 10px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,220,180,.35)}

/* ===== DÉFIS ===== */
.chal-row{padding-top:4px;padding-bottom:10px}
.chal{flex:none;width:210px;min-height:150px;padding:12px 14px;border-radius:18px;background:var(--bg2);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:4px;position:relative;overflow:hidden;transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.chal:active{transform:scale(.96)}
.chal::before{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;opacity:.14}
.chal.lv1::before{background:#34C759}.chal.lv2::before{background:#FF9F0A}.chal.lv3::before{background:#FF375F}
.ch-lv{font-size:11px;font-weight:800;border-radius:8px;padding:2px 8px;color:#fff}
.lv1 .ch-lv{background:#34C759}.lv2 .ch-lv{background:#FF9F0A}.lv3 .ch-lv{background:#FF375F}
.chal b{font-family:var(--serif);font-size:18px;line-height:1.15;margin-top:2px}
.ch-d{font-size:13px;color:var(--label2);line-height:1.3}
.ch-f{margin-top:auto;padding-top:6px;font-size:13px;font-weight:700;color:var(--tint);display:inline-flex;align-items:center;gap:4px}
.ch-f svg{width:14px;height:14px}
.chal.on{box-shadow:inset 0 0 0 2px var(--tint),var(--shadow)}
.chal.done{background:color-mix(in srgb,var(--green) 10%,var(--bg2))}
.chal.done .ch-f{color:var(--green)}
.chal-ban{margin:12px 16px 0;padding:12px 14px;border-radius:16px;background:var(--tint-bg);animation:vin .4s both}
.cb-t{display:flex;justify-content:space-between;align-items:center}.cb-t b{font-family:var(--serif);font-size:17px}
.cb-c{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cb-c span{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:12px;background:var(--bg2);color:var(--label2)}
.cb-c span svg{width:13px;height:13px}
.cb-c span.ok{background:color-mix(in srgb,var(--green) 18%,var(--bg2));color:var(--green)}
.sv-chal{display:flex;align-items:center;gap:12px;width:100%;max-width:380px;margin-top:18px;padding:12px 14px;border-radius:16px;text-align:left;opacity:0;transform:scale(.9);transition:opacity .4s .7s,transform .5s cubic-bezier(.3,1.7,.5,1) .7s}
#serve.p4 .sv-chal{opacity:1;transform:none}
.sv-chal.win{background:linear-gradient(135deg,#34C759,#1E9E48)}
.sv-chal.lose{background:rgba(255,255,255,.12)}
.svc-ic{width:36px;height:36px;border-radius:18px;background:rgba(255,255,255,.25);display:grid;place-items:center;font-weight:800;flex:none}
.svc-ic svg{width:20px;height:20px}
.sv-chal b{display:block;font-size:16px}.sv-chal span{font-size:13px;opacity:.9}
/* carte plus grande en zoom */
.world svg{aspect-ratio:auto;height:170px}
.world.zoom svg{height:300px}
.world svg{transition:height .45s cubic-bezier(.2,.8,.2,1)}
/* arbre vertical */
.ttree,.tul{list-style:none;margin:0;padding:0}
.ttree{margin:12px 16px 0}
.tul{padding-left:22px;margin-left:16px;border-left:2px solid color-mix(in srgb,var(--tint) 45%,transparent)}
.tli{position:relative;padding-top:8px;animation:tnodein .5s cubic-bezier(.3,1.4,.5,1) var(--d) both}
.tul>.tli::before{content:"";position:absolute;left:-24px;top:34px;width:20px;height:2px;background:color-mix(in srgb,var(--tint) 45%,transparent)}
.tul>.tli.last::after{content:"";position:absolute;left:-26px;top:36px;bottom:0;width:4px;background:var(--bg)}
.tcard{position:relative;display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px 8px 8px;border-radius:14px;background:var(--bg2);box-shadow:var(--shadow);text-align:left;transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.tcard:active{transform:scale(.97)}
.tcard .tg{width:32px;height:40px;flex:none;display:grid}.tcard .tg svg{width:100%;height:100%}
.tt2{flex:1;min-width:0}
.tt2 b{display:block;font-family:var(--serif);font-size:16px}
.tt2 span{display:block;font-size:12.5px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ty{font-style:normal;font-family:var(--rounded);font-size:12px;font-weight:800;color:var(--tint);background:var(--tint-bg);border-radius:8px;padding:2px 7px;flex:none}
.tcard.made{box-shadow:inset 0 0 0 2px #E8B040,var(--shadow)}
.tok{position:absolute;top:7px;left:7px;width:8px;height:8px;border-radius:4px;background:var(--green);box-shadow:0 0 0 2px var(--bg2)}

/* ===== 1.17 ===== */
/* conseils sur les objectifs */
.sv-goal{cursor:pointer;transition:background .2s,transform .2s cubic-bezier(.3,1.4,.5,1)}
.sv-goal:active{transform:scale(.96)}
.sv-goal.sel{background:rgba(255,255,255,.26);box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.sv-hint{font-size:13px;opacity:0;margin-top:10px;transition:opacity .5s .9s}
#serve.p4 .sv-hint{opacity:.75}
.sv-adv{width:100%;max-width:380px}
.sv-adv.show{animation:vin .4s cubic-bezier(.2,.8,.2,1) both}
.sv-adv .adv{margin-top:12px;background:#fff;color:#1A1020;border-radius:18px;padding:14px 16px;text-align:left}
.adv-h{display:flex;justify-content:space-between;align-items:baseline}
.adv-h b{font-family:var(--serif);font-size:19px}
.adv-h span{font-family:var(--rounded);font-weight:800;font-size:14px;color:#FF6B35}
.adv.ok .adv-h span{color:#1E9E48}
.adv p{margin:6px 0 0;font-size:15px;line-height:1.4;color:#3A3440}
.adv-b{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sheet .adv{padding:0 16px}.sheet .adv p{color:var(--label2)}.sheet .adv-h span{color:var(--orange)}
button.goal{font:inherit;font-size:13px;font-weight:600;cursor:pointer}
button.goal:not(.ok){box-shadow:inset 0 0 0 1px currentColor}
/* familles explorées */
.fam-bar{height:8px;border-radius:4px;background:var(--fill);margin:0 16px 12px;overflow:hidden}
.fam-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--tint),#F2C040);transform-origin:left;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
.fams{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 16px}
.famc{display:flex;align-items:center;gap:9px;min-height:48px;padding:8px 12px;border-radius:14px;text-align:left;background:transparent;box-shadow:inset 0 0 0 1.5px var(--sep);border:1.5px dashed transparent;transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.famc:active{transform:scale(.96)}
.famc .fc-ic{width:22px;height:22px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--tint);color:var(--on-tint)}
.famc .fc-ic svg{width:13px;height:13px}
.famc .fc-ic.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--label3)}
.famc .fc-n{flex:1;font-size:14px;font-weight:600;line-height:1.15}
.famc b{font-family:var(--rounded);font-size:15px;color:var(--tint)}
.famc em{font-style:normal;font-size:11px;color:var(--label3);font-weight:600}
.famc.on{background:var(--tint-bg);box-shadow:none}
.famc:not(.on) .fc-n{color:var(--label2)}
/* à propos */
.about-foot{display:flex;flex-direction:column;align-items:center;gap:3px;margin:22px 16px 8px;text-align:center}
.af-logo{width:40px;height:50px;margin-bottom:6px}.af-logo svg{width:100%;height:100%}
.about-foot b{font-family:var(--serif);font-size:18px}
.about-foot span{font-size:13px;color:var(--label2)}
/* carte : ouverture et plein écran */
.world{position:relative;cursor:pointer}
.world-open{position:absolute;right:10px;bottom:10px;z-index:2;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;background:var(--bg2);color:var(--tint);font-weight:700;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.world-open svg{width:16px;height:16px}
#mapfs{position:fixed;inset:0;z-index:275;background:var(--bg);display:flex;flex-direction:column;opacity:0;transform:scale(.96);transition:opacity .3s,transform .35s cubic-bezier(.2,.9,.25,1)}
#mapfs.open{opacity:1;transform:none}
.mf-top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px}
.mf-top b{flex:1;font-family:var(--serif);font-size:19px}
.mf-zoom{display:flex;gap:6px}
.mf-zoom button{width:38px;height:38px;border-radius:19px;background:var(--fill);font-size:22px;font-weight:600;color:var(--label)}
.mf-map{flex:1;min-height:0;position:relative;overflow:hidden}
#mfsvg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;background:color-mix(in srgb,#3A8AC0 10%,var(--bg2))}
#mfsvg .sea{fill:color-mix(in srgb,#3A8AC0 10%,var(--bg2))}
#mfsvg .grat path{stroke:var(--sep);stroke-width:.15;fill:none}
#mfsvg .land{fill:color-mix(in srgb,var(--tint) 16%,var(--bg3));stroke:color-mix(in srgb,var(--tint) 30%,transparent);stroke-width:.25}
.mpin.sel .pin-dot{fill:#FF375F}
.mf-panel{padding:10px 0 calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--bg2);border-radius:22px 22px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.1)}
.mf-reg{margin-bottom:6px}
.mf-city{padding:0 16px;min-height:44px}
.mf-city.show{animation:vin .35s cubic-bezier(.2,.8,.2,1) both}
.mfc-h{display:flex;justify-content:space-between;align-items:baseline}.mfc-h b{font-family:var(--serif);font-size:22px}.mfc-h span{font-size:14px;color:var(--label2)}
.mf-city p{margin:4px 0 8px;font-size:14px;color:var(--label2)}
.mfc-list{margin:0 -16px;padding-bottom:4px}
.mfc-r{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:14px;background:var(--bg);text-align:center}
.mfc-r span{width:30px;height:38px;display:grid}.mfc-r span svg{width:100%;height:100%}
.mfc-r b{font-family:var(--serif);font-size:12px;line-height:1.15}
.famc .fc-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.famc.on em{color:var(--tint)}

/* ===== Étagère 2.0 ===== */
.bar2{position:relative;margin:0 16px;padding:14px 0 8px;border-radius:24px;overflow:hidden;background:
  linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px) 0 0/24% 100%,
  linear-gradient(180deg,#241812 0%,#1A110C 55%,#140D09 100%);box-shadow:inset 0 0 0 .5px rgba(255,220,180,.1),0 14px 34px rgba(0,0,0,.22)}
.bar2::before{content:"";position:absolute;inset:36px 12px 12px;border-radius:14px;background:linear-gradient(115deg,rgba(255,235,210,.07),rgba(255,235,210,0) 40%,rgba(255,235,210,.05) 60%,rgba(255,235,210,0));pointer-events:none}
.b2-glow{position:absolute;left:8%;right:8%;top:-110px;height:200px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,190,110,.35),transparent);pointer-events:none;animation:lamp 7s ease-in-out infinite}
.b2-head{position:relative;display:flex;justify-content:space-between;align-items:center;padding:0 16px 6px;color:rgba(255,232,205,.9)}
.b2-head b{font-family:var(--serif);font-size:17px}
.b2-warn{font-size:12px;font-weight:800;color:#fff;background:#FF453A;border-radius:10px;padding:3px 9px}
.b2-shelf{position:relative;margin-top:10px}
.b2-lab{display:flex;align-items:center;gap:6px;margin:0 16px 2px;font-size:12px;font-weight:800;color:rgba(255,222,185,.75);letter-spacing:.02em}
.b2-lab i{font-style:normal;font-family:var(--rounded);font-size:11px;background:rgba(255,222,185,.14);border-radius:8px;padding:1px 7px}
.b2-row{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 0;align-items:flex-start;scroll-snap-type:x proximity;scrollbar-width:none;min-height:150px}
.b2-row::-webkit-scrollbar{display:none}
.b2-b{flex:none;width:70px;display:flex;flex-direction:column;align-items:center;gap:6px;scroll-snap-align:start;animation:b2in .7s cubic-bezier(.3,1.5,.5,1) calc(var(--i)*35ms) both;transition:transform .22s cubic-bezier(.3,1.6,.5,1);--glass-stroke:rgba(255,240,220,.6);--glass-fill:rgba(255,240,220,.08);--label3:rgba(255,230,200,.45)}
@keyframes b2in{0%{opacity:0;transform:translateY(-26px) rotate(-5deg)}100%{opacity:1;transform:none}}
.b2-svg{position:relative;display:block;width:48px;height:86px}
.b2-svg svg{width:100%;height:100%;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}

@keyframes b2shine{0%,78%{left:-60%}100%{left:130%}}
.b2-b.vide .b2-svg{opacity:.4}
.b2-tag{width:100%;height:52px;padding:5px 4px 4px;justify-content:center;border-radius:8px;background:#F6EEE2;color:#2A1C12;box-shadow:0 3px 6px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;gap:3px;transform:rotate(-1deg)}
.b2-b:nth-child(2n) .b2-tag{transform:rotate(1deg)}
.b2-n{font-size:11px;font-weight:700;line-height:1.12;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.b2-l{font-family:var(--rounded);font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 6px;color:#fff}
.b2-l.l4,.b2-l.l3{background:#30A14E}.b2-l.l2{background:#E09A1A}.b2-l.l1{background:#E0602A}.b2-l.l0{background:#E03A3A}
.b2-b.lift{transform:translateY(-16px) rotate(-7deg)}
.b2-b:active{transform:translateY(-8px)}
.b2-board{position:relative;height:14px;margin:-4px 8px 0;border-radius:4px;background:linear-gradient(180deg,#9A6A3E,#64401F 70%,#4A2E15);box-shadow:0 8px 12px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,225,190,.4)}
.b2-board i{position:absolute;left:6%;right:6%;top:100%;height:18px;background:radial-gradient(closest-side,rgba(255,180,90,.28),transparent);filter:blur(2px)}
@media (prefers-reduced-motion:reduce){.b2-b,.b2-glow{animation:none!important}}
.tile.lite .tg svg{height:62px;width:auto}

/* ===== 1.20 ===== */
.cf-box{text-align:center;padding:0 22px 8px}
.cf-ic{width:60px;height:60px;border-radius:30px;margin:0 auto 10px;display:grid;place-items:center;background:var(--tint-bg);color:var(--tint)}
.cf-ic.danger{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.cf-ic svg{width:30px;height:30px}
.cf-box h2{font-family:var(--serif);font-size:24px;margin:4px 0 8px}
.cf-box p{color:var(--label2);font-size:16px;line-height:1.45;margin:0 0 18px}
.cf-btns{display:flex;flex-direction:column;gap:10px}
.btn.danger-fill{background:var(--red)!important;color:#fff!important}
.sv-goal.bonus .sv-gi{background:rgba(255,255,255,.35);color:#fff}
.goal.bonus{color:var(--label2)}
.goal.bonus i{background:var(--fill);color:var(--label2)}
.rw-in-foryou .rw-card{margin-top:14px}
.rw-card.month{background:linear-gradient(125deg,#3A8AC8,#5E5CE6 50%,#AF52DE);background-size:200% 200%}
.rw-card.month .rw-play{color:#5E5CE6}
svg.medal.secret{filter:none}
.trophy.secret .tn{color:var(--label2)}

["t6",/Écrase délicatement/i,"Piler","Presser doucement herbes ou fruits au fond du verre pour libérer leurs arômes (« muddle » en anglais). Trop fort, la menthe devient amère."],
["t7",/Rince/,"Rincer le verre","On fait tourner quelques gouttes d’un alcool très parfumé, souvent l’absinthe, pour en tapisser la paroi, puis on jette l’excédent. Il ne reste qu’un parfum."],

function dilution(method, A, ice){
  if(method==="shake"||method==="mshake") return 1.567*A*A+1.742*A+0.203;

}

    const s = it.id==="sucre" ? it.q*4 : ml*i.sug/100;
    if(it.r==="top"||it.r==="float"){ Vt+=ml; alct+=ml*i.abv/100; sugt+=s; act+=ml*i.ac/100; }
    else { V+=ml; alc+=ml*i.abv/100; sug+=s; ac+=ml*i.ac/100; }
  });

const DEFVOL={spirit:700,liqueur:700,amaro:700,vin:750,bitters:200,sirop:700,soft:1000,jus:1000,frais:500};
// estimation des basiques, en CHF par unité (ml, trait, feuille ou pièce)
const BASIC_COST={citron:0.02,citron_vert:0.025,sirop_sucre:0.002,sirop_miel:0.02,blanc_oeuf:0.017,oeuf:0.5,creme:0.008,lait:0.0016,menthe:0.04,basilic:0.05,concombre:0.08,cafe:0.004,espresso:0.012,fleur_oranger:0.02,marmelade:0.1,worcestershire:0.02,tabasco:0.02,sucre:0.02,eau:0};
function hasPrices(){ return Object.values(S.price||{}).some(p=>p&&p.p>0); }
function unitPrice(id){ const p=(S.price||{})[id]; if(!p||!p.p) return null; return p.p/(p.v||DEFVOL[ING[id].cat]||700); }
function costOf(items, mult=1){
  let tot=0, est=0; const miss=[];
  items.forEach(it=>{ const i=ING[it.id]; if(!i||it.r==="rinse") return;
    if(i.basic){ const u=BASIC_COST[it.id]||0; const q=(it.u==="f"||it.u==="u"||it.u==="d")?it.q:it.id==="marmelade"?it.q:mlOf(it); est+=u*q*mult; return; }
    const up=unitPrice(it.id); if(up==null){ if(it.r!=="opt") miss.push(it.id); return; } tot+=up*mlOf(it)*mult; });
  return {tot:tot+est, est, miss:[...new Set(miss)]};
}
function chf(x){ const c=(S.settings&&S.settings.cur)||"CHF"; return (c==="CHF"?(Math.round(x*20)/20):Math.round(x*100)/100).toFixed(2).replace(".",",")+" "+(c==="EUR"?"€":"CHF"); }
function barValue(){ let v=0; Object.entries(S.stock).forEach(([id,l])=>{ const p=(S.price||{})[id]; if(p&&p.p&&tracked(id)&&l>0) v+=p.p*l/4; }); return v; }

// ================= ACCORDS METS ET COCKTAILS =================
function pairFeatures(r){ const p=profileR(r), av=avgProfile(), m=metricsR(r);
  const fz=r.ing.some(i=>ING[i.id].fizz)?1:0;
  return {sweet:p[0]-av[0],acid:p[1]-av[1],bitter:p[2]-av[2],strong:p[3]-av[3],fruity:p[4]-av[4],herbal:p[5]-av[5],spicy:p[6]-av[6],woody:p[7]-av[7],cream:(p[8]||0)-0.15,fizz:fz-0.35,light:m.abv<10?1:0}; }
function dishPicks(d){
  const out=RECS.filter(r=>!r.mine).map(r=>{ const f=pairFeatures(r); let s=0, best=null, bv=0;
    for(const k in d.want){ const v=d.want[k]*(f[k]||0); s+=v*2.2; if(v>bv){bv=v;best=k;} }
    const pk=d.picks.indexOf(r.id); if(pk>=0) s+=3-pk*0.25;
    if(d.base.includes(baseGroup(r))) s+=0.4;
    if(status(r).ok) s+=0.7; s+=(predict(r)-3)*0.35; if(r.na&&!S.settings.na) s-=1.2;
    let why=best?PAIR_WHY[best]:PAIR_WHY.light; if((d.id==="fondue"||d.id==="raclette")&&["kirsch","williamine","pflumli","abricotine","trasch","genepi"].includes(r.base)) why=PAIR_WHY.trad;
    return {r,s,why}; }).sort((a,b)=>b.s-a.s);
  const res=[]; for(const x of out){ if(res.length>=7) break; if(res.some(y=>cos(fvec(y.r),fvec(x.r))>0.97)) continue; res.push(x); } return res;
}

function mixItems(){ S.mix.items=(S.mix.items||[]).filter(i=>i&&ING[i.id]); return S.mix.items.map(it=>({id:it.id,q:it.q,u:unitOf(it.id),r:ING[it.id].fizz&&S.mix.m!=="build"?"top":""})); }
function mixIce(){ return S.mix.m==="build"?"cubes":"none"; }
function analyze(){
  const items=mixItems(), m=S.mix.m; if(!items.length) return null;
  const met=calc(items,m,mixIce()), st=labStyle(items,m), z=ZONES[st]||ZONES.sour, ratio=met.sug/Math.max(.05,met.acid*10);
  const out=[]; const base=baseOf(items)||"gin";
  const pickAcid=()=>{ const g=SPIRIT_GROUP[base]; const pref=(g==="rhum"||g==="agave"||g==="vodka"||items.some(i=>i.id==="ginger_beer"))?["citron_vert","citron"]:["citron","citron_vert"]; return pref.find(has)||pref[0]; };
  const pickSweet=()=>{ const g=SPIRIT_GROUP[base]; const pref=g==="agave"?["sirop_agave"]:g==="whisky"?["sirop_miel"]:g==="rhum"?["orgeat","sirop_sucre"]:[]; return pref.find(has)||"sirop_sucre"; };
  const solve=(id,fn,target,max=90)=>{ const u=unitOf(id); let lo=0,hi=max; for(let k=0;k<30;k++){ const mid=(lo+hi)/2; const t=items.concat([{id,q:mid,u,r:ING[id].fizz&&m!=="build"?"top":""}]); const v=fn(calc(t,m,mixIce())); if((v<target)===(fn(calc(items,m,mixIce()))<target)) lo=mid; else hi=mid; }
    const x=(lo+hi)/2; const step=u==="d"?1:2.5; const r=Math.round(x/step)*step; return r>=step?r:0; };
  const fix=(id,x,label,why)=>out.push({warn:1,t:label,why,fix:x?{id,q:x}:null});
  if(st==="sour"||st==="long"){
    if(met.acid<(st==="long"?Math.max(z.acid[0]*0.9,0.2):z.acid[0]*0.85)){ const id=pickAcid(); const x=solve(id,mm=>mm.acid,z.acid[1],60); fix(id,x,"Il manque d’acidité","Sans acide, le mélange paraît plat et sucré. Dans ce style, les recettes équilibrées tournent autour de "+num(Math.round(z.acid[1]*10)/10)+" % d’acidité."); }
    else if(ratio>z.ratio[2]*1.25){ const id=pickAcid(); const x=solve(id,mm=>mm.sug/Math.max(.05,mm.acid*10),z.ratio[1],60); fix(id,x,"Un peu trop sucré","Le sucre prend le dessus sur l’acidité. Rééquilibre avec de l’agrume plutôt que d’enlever du goût."); }
    else if(ratio<z.ratio[0]*0.62){ const id=pickSweet(); const x=solve(id,mm=>mm.sug/Math.max(.05,mm.acid*10),z.ratio[1],50); fix(id,x,"Trop acide","L’acidité agresse le palais. Un peu de sucre arrondit sans masquer."); }
  } else if(st==="spritz"){
    if(met.sug>z.sug[2]*1.3){ const fz=items.find(i=>ING[i.id].fizz)||{id:"eau_gazeuse"}; const x=solve(fz.id,mm=>mm.sug,z.sug[1],200); fix(fz.id,x,"Un peu trop sucré","Allonge avec plus de bulles pour retrouver la légèreté d’un spritz."); }
  } else if(st==="stirred"){
    if(met.sug>z.sug[2]*1.15){ const x=solve(base,mm=>mm.sug,z.sug[1],90); fix(base,x,"Trop sucré pour un cocktail sec","Les cocktails mélangés au verre restent secs. Ajoute un peu de spiritueux de base."); }
    else if(met.sug<1 && met.abv>18 && !items.some(i=>["vin","liqueur","amaro","sirop"].includes(ING[i.id].cat))){ const x=solve("sirop_sucre",mm=>mm.sug,z.sug[1]*0.8,20); fix("sirop_sucre",x,"Très sec","Une touche de sucre relie les arômes, comme dans un Old Fashioned."); }
  }
  if(st!=="cremeux" && met.abv>z.abv[2]*1.15){
    if(st==="long"||st==="spritz"){ const fz=items.find(i=>ING[i.id].fizz); const id=fz?fz.id:"eau_gazeuse"; const x=solve(id,mm=>-mm.abv,-z.abv[1],250); fix(id,x,"Très fort pour un long drink","Allonge pour retrouver la fraîcheur."); }
    else out.push({warn:1,t:"Très fort pour ce style",why:"Environ "+Math.round(met.abv)+" % d’alcool une fois dilué : "+(m==="shake"?"secoue plus longtemps ou ":"")+"allonge un peu les autres ingrédients."});
  } else if((st==="sour"||st==="stirred") && met.abv<z.abv[0]*0.75 && met.abv>0.5){ const x=solve(base,mm=>mm.abv,z.abv[1],60); fix(base,x,"Un peu léger","Le spiritueux se perd. Renforce la base."); }
  if(!out.length) out.push({warn:0,t:"Bien équilibré",why:"Ton mélange tombe dans les proportions des "+z.n+" recettes du même style de la base."});
  return {met,st,z,ratio,diag:out.slice(0,2),items};
}
function zoneBar(v,z,max){ const X=x=>clamp01(x/max)*100; return `<div class="zone"><i style="left:${X(z[0])}%;width:${X(z[2])-X(z[0])}%"></i><b style="left:${X(v)}%"></b></div>`; }
function pairings(items){
  const inMix=new Set(items.map(i=>i.id)); const base=baseOf(items); let g=base&&SPIRIT_GROUP[base]; if(!g&&items.some(i=>i.id==="ginger_beer")) g="gingembre";
  let L=(PAIR[g]||PAIR.gin).slice(); if(items.some(i=>i.id==="ginger_beer"||i.id==="sirop_gingembre")) L=L.concat(PAIR.gingembre);
  L=[...new Set(L)].filter(id=>!inMix.has(id)&&ING[id]); L.sort((a,b)=>has(b)-has(a)); return L.slice(0,4);
}
function nearest(items){
  const key=id=>["citron","citron_vert"].includes(id)?"agr":["sirop_sucre","sirop_miel","sirop_agave"].includes(id)?"suc":["ginger_beer","ginger_ale"].includes(id)?"ging":["eau_gazeuse","limonade"].includes(id)?"soda":SPIRIT_GROUP[id]&&ING[id].cat==="spirit"?"sp_"+SPIRIT_GROUP[id]:id;
  const vec=L=>{ const v={}; L.forEach(i=>{ if(i.r==="rinse") return; const k=key(i.id); v[k]=(v[k]||0)+Math.sqrt(Math.max(mlOf(i),1)); }); return v; };
  const a=vec(items); const cs=(x,y)=>{ let d=0,nx=0,ny=0; for(const k in x){ nx+=x[k]*x[k]; if(y[k]) d+=x[k]*y[k]; } for(const k in y) ny+=y[k]*y[k]; return d/Math.sqrt(nx*ny||1); };
  return RECS.map(r=>[r,cs(a,vec(r.ing))]).filter(x=>x[1]>0.62).sort((p,q2)=>q2[1]-p[1]).slice(0,3);
}
function vCompose(){

}
function defaultQ(id){ const i=ING[id], u=unitOf(id); if(u==="d") return 2; if(u==="f") return 6; if(u==="u") return 1; if(u==="bs") return 1;
  if(id==="blanc_oeuf") return 20; if(i.fizz) return 100; return {spirit:45,liqueur:15,amaro:22.5,vin:30,sirop:15,jus:(i.ac>3?22.5:60),frais:30}[i.cat]||30; }
function stepQ(q,u,d){ if(u==="d"||u==="f"||u==="u"||u==="bs") return Math.max(1,q+d); const st=q<30||(q===30&&d<0)?2.5:q<100||(q===100&&d<0)?5:10; return Math.max(2.5,Math.round((q+d*st)*10)/10); }
function aiPrompt(){

const SHEETS=[];
function openSheet(render, opt={}){

function paintSheet(sh){
  const body=sh.el.querySelector(".sheet-body"), st=body?body.scrollTop:0; const r=sh.render();

  animateSegs(sh.el); const nb=sh.el.querySelector(".sheet-body"); nb.scrollTop=st; const hd=sh.el.querySelector(".sheet-head"); const upd=()=>hd.classList.toggle("scrolled",nb.scrollTop>40); nb.addEventListener("scroll",upd,{passive:true}); upd(); if(r.after) r.after(sh.el);
}

function closeSheet(){ const sh=SHEETS.pop(); if(!sh) return; if(!SHEETS.length) document.body.classList.remove("sheet-open"); sh.el.classList.remove("open"); sh.bd.classList.remove("open"); setTimeout(()=>{sh.el.remove(); sh.bd.remove();},420); if(dirty[TAB]) renderView(TAB); }

function dragSheet(sh){
  let y0=null,dy=0; const el=sh.el;
  el.addEventListener("touchstart",e=>{ const head=e.target.closest(".sheet-head"); const body=el.querySelector(".sheet-body"); if(!head && body.scrollTop>0) return; if(e.target.closest("button,input,textarea,.stepper,.lvl,.chips,.segchips,.scroller,.sheet-foot")) return; y0=e.touches[0].clientY; dy=0; },{passive:true});

}

function confetti(x,y,col){
  if(typeof FX==="function"&&!FX("confetti")) return;
  const L=["#F2C94C","#F29A30","#E8584A","#9CCB4A","#F4EFA8",col||"#FFB340"]; const box=document.createElement("div"); box.className="confetti"; document.body.appendChild(box);
  for(let k=0;k<34;k++){ const s=document.createElement("i"); const a=Math.random()*Math.PI*2, v=90+Math.random()*170;
    s.style.cssText=`left:${x}px;top:${y}px;background:${L[k%L.length]};--x:${Math.cos(a)*v}px;--y:${Math.sin(a)*v-120}px;--r:${Math.random()*720-360}deg;animation-delay:${Math.random()*60}ms;${k%3?"border-radius:50%;width:9px;height:9px":""}`; box.appendChild(s); }
  setTimeout(()=>box.remove(),1500);
}

let QZ=null;
function openQuiz(){ QZ={i:0,a:Object.assign({},S.quiz||{}),dir:"fwd"}; $("#overlay").classList.add("open"); paintQuiz(); }
function paintQuiz(){
  const n=QUIZ.length, ov=$("#overlay");
  if(QZ.i>=n){ return paintQuizEnd(); }
  const q=QUIZ[QZ.i], cur=QZ.a[q.id], sel=v=>q.multi?(cur||[]).includes(v):cur===v;
  ov.innerHTML=`<div class="ov-top"><button class="close-x" data-a="qzskip" aria-label="Passer">${IC.x}</button><div class="qz-prog">${QUIZ.map((_,k)=>`<i class="${k<QZ.i?"done":k===QZ.i?"now":""}"></i>`).join("")}</div><button class="link" data-a="qzskip" style="font-size:15px">Passer</button></div>
  <div class="ov-body qz ${QZ.dir}"><div class="bm-count">Question ${QZ.i+1} sur ${n}</div><div class="qz-q">${esc(q.q)}</div>${q.sub?`<div class="muted" style="margin-top:6px">${esc(q.sub)}</div>`:""}
  <div class="qz-opts ${q.o.length>4?"many":""}">${q.o.map(([v,l,rid],k)=>`<button class="qz-o ${sel(v)?"on":""}" data-a="qzpick" data-v="${v}" style="animation-delay:${60+k*50}ms"><span class="qz-g">${glassSVG(RMAP[rid],{garnish:true})}</span><span class="qz-l">${esc(l)}</span>${sel(v)?`<span class="qz-ck">${IC.check}</span>`:""}</button>`).join("")}</div></div>
  <div class="ov-bottom">${QZ.i>0?`<button class="btn gray" data-a="qznav" data-d="-1" style="flex:0 0 34%">Retour</button>`:""}${q.multi?`<button class="btn" data-a="qznav" data-d="1">${(cur||[]).length?"Continuer":"Aucun en particulier"}</button>`:""}</div>`;
  QZ.dir="";
}
function paintQuizEnd(){
  S.quiz=QZ.a; S.quizSkip=0; save(); MODEL=null; Object.keys(dirty).forEach(k=>dirty[k]=1);
  const sty=tasteStyle()||"Curieux de tout"; const tops=RECS.filter(r=>!r.na).sort((a,b)=>(predict(b)+(b.c?0.25:0))-(predict(a)+(a.c?0.25:0))).slice(0,3);
  $("#overlay").innerHTML=`<div class="ov-top"><div></div><div></div><button class="close-x" data-a="qzdone" aria-label="Fermer">${IC.x}</button></div>
  <div class="ov-body qz-end"><div class="qz-badge">${IC.sparkle}</div><div class="bm-count" style="text-align:center">Ton style</div><div class="qz-style">${esc(sty)}</div><p class="muted" style="text-align:center;margin:8px 10px 0">Tes suggestions sont déjà ajustées. Elles deviendront encore plus justes à chaque cocktail que tu notes.</p>
  <div class="qz-tops">${tops.map((r,k)=>`<div class="qz-top" style="animation-delay:${350+k*120}ms"><div class="qz-tg">${glassSVG(r,{pour:true})}</div><div class="qz-tn">${esc(r.n)}</div><div class="qz-tm">${matchPct(r)} %</div></div>`).join("")}</div></div>
  <div class="ov-bottom"><button class="btn" data-a="qzdone">C’est parti</button></div>`;
  setTimeout(()=>confetti(innerWidth/2,innerHeight*0.32),250);
}

async function copyText(t,msg){
  try{ await navigator.clipboard.writeText(t); toast(msg); return; }catch(e){}
  try{ const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); const ok=document.execCommand("copy"); ta.remove(); if(ok){ toast(msg); return; } }catch(e){}
  textSheet("Prompt pour une IA",t);
}
async function exportData(){
  const json=JSON.stringify(S,null,1), name="zeste-sauvegarde-"+new Date().toISOString().slice(0,10)+".json";
  try{ const dl=window.claude&&await claude.use("downloads"); if(dl){ await dl.save({filename:name,data:json}); return; } }catch(e){ if(e&&e.code&&e.code!=="unavailable") return; }
  textSheet("Sauvegarde",json);
}
function importData(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!d||typeof d.stock!=="object") throw 0; S=Object.assign(DEF(),d); fixState(); buildRecipes(S.custom); changed(); toast("Sauvegarde importée"); }catch(e){ toast("Ce fichier n’est pas une sauvegarde Zeste"); } }; rd.readAsText(f); };
  inp.click();
}

function labReco(st, items){

    if(ids.some(i=>["vermouth_dry","lillet","vermouth_blanc"].includes(i))&&!ids.includes("campari")) return {g:"martini",ice:"none",m:"stir"};
    if(["whisky","brandy","rhum","agave","amer"].includes(grp)||ids.includes("campari")) return {g:"rocks",ice:"big",m:"stir"};
    return {g:"coupe",ice:"none",m:"stir"}; }

function labScore(A){

  // dans la plage des classiques = plein score, puis ça décroît en s'éloignant
  const zone=(v,lo,hi,span)=>{ v=Math.max(v,1e-3); if(v>=lo&&v<=hi) return 1; const d=v<lo? Math.log(lo/v) : Math.log(v/hi); return Math.max(0,1-d/Math.log(span)); };

  const iceOk={long:["cubes","pilee"],spritz:["cubes","big","none"],stirred:["big","none","cubes"],sour:["none","cubes","pilee"],cremeux:["none","cubes"]}[st]||["none","cubes","big","pilee"];
  const iceS= M.t==="shot"? (ice==="none"?1:0.2) : iceOk.includes(ice)?1:0.2;
  const glassOk={long:["highball","mug","vin","rocks"],spritz:["vin","flute","highball","coupe"],stirred:["rocks","coupe","martini"],sour:["coupe","martini","rocks"],cremeux:["coupe","martini","rocks","tasse"]}[st]||[];

}

function sanitizeBackup(d){

  if(isObj(d.ratings)) Object.entries(d.ratings).forEach(([id,v])=>{ if(num(v)&&v>=1&&v<=5) out.ratings[id]=Math.round(v); });
  if(Array.isArray(d.hist)) out.hist=d.hist.filter(h=>h&&typeof h.id==="string"&&num(h.t)).map(h=>({id:h.id,t:h.t}));
  if(Array.isArray(d.fav)) out.fav=d.fav.filter(x=>typeof x==="string");
  if(Array.isArray(d.custom)) out.custom=d.custom.filter(r=>r&&typeof r.id==="string"&&typeof r.n==="string"&&Array.isArray(r.ing)&&r.ing.every(i=>i&&ING[i.id]&&num(i.q)));
  if(isObj(d.settings)) out.settings=Object.assign({},out.settings,d.settings);

  ["quiz","adj","notes","price","stockT","opened","opens","mw","skips","chal","dishes","troT","rt","mix","heroLog"].forEach(k=>{ if(isObj(d[k])) out[k]=d[k]; });
  ["tro","preps","citiesSeen","linSeen"].forEach(k=>{ if(Array.isArray(d[k])) out[k]=d[k]; });

function availableMonths(){ const set=new Map(); S.hist.forEach(h=>{ if(!RMAP[h.id]) return; const d=new Date(h.t), k=d.getFullYear()*12+d.getMonth(); set.set(k,(set.get(k)||0)+1); }); return [...set.entries()].sort((a,b)=>b[0]-a[0]).map(([k,n])=>({y:Math.floor(k/12),m:k%12,n})); }
function rewindCards(){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth(), d=now.getDate(), cards=[];
  const cur=availableMonths().find(x=>x.y===y&&x.m===m), prevY=m?y:y-1, prevM=m?m-1:11, prev=availableMonths().find(x=>x.y===prevY&&x.m===prevM);
  if(m===11&&rewindEligible()) cards.push(`<button class="rw-card" data-a="rewind"><div class="rw-bg"></div><div class="rw-in"><div class="rw-k">${IC.sparkle}Zeste Rewind ${y}</div><div class="rw-t">Ton année en cocktails</div><div class="rw-s">Revis toute ton année en quelques histoires.</div></div><div class="rw-play">${IC.play}</div></button>`);
  if(prev&&d<=10) cards.push(`<button class="rw-card month" data-a="rwmonth" data-y="${prevY}" data-m="${prevM}"><div class="rw-bg"></div><div class="rw-in"><div class="rw-k">${IC.sparkle}Récap du mois</div><div class="rw-t">Ton mois de ${MOIS[prevM]}</div><div class="rw-s">${prev.n} cocktail${prev.n>1?"s":""} préparé${prev.n>1?"s":""}. Revis ton mois en quelques histoires.</div></div><div class="rw-play">${IC.play}</div></button>`);
  else if(cur&&cur.n>=3) cards.push(`<button class="rw-card month" data-a="rwmonth" data-y="${y}" data-m="${m}"><div class="rw-bg"></div><div class="rw-in"><div class="rw-k">${IC.sparkle}Ton mois en cours</div><div class="rw-t">${MOIS[m].replace(/^./,c=>c.toUpperCase())}, jusqu’ici</div><div class="rw-s">${cur.n} cocktails depuis le 1er ${MOIS[m]}.</div></div><div class="rw-play">${IC.play}</div></button>`);

    b+=`<div class="gh">À propos</div><div class="group">${srow("info","Version",`<span class="val">${APP_VERSION}</span>`)}${srow("info","Recettes",`<span class="val">${RECS.filter(r=>!r.mine).length}, dont ${RECS.filter(r=>r.na).length} sans alcool</span>`)}</div><div class="about-foot"><div class="af-logo">${glassSVG(RMAP.negroni)}</div><b>Zeste ${APP_VERSION}</b><span>${esc(COPYRIGHT)}</span><span>À consommer avec modération. Santé !</span></div>`;
    return {title:"Paramètres",right:`<button class="link" data-a="closesheet" style="font-weight:600">OK</button>`,body:b};
  });
}
function fxSheet(){
  openSheet(()=>({title:"Animations",body:`<p class="body" style="margin-bottom:12px">Active ou coupe chaque animation. Les petites animations essentielles restent toujours là.</p><div class="group">${FX_LIST.map(([k,n,d])=>`<div class="row fx-row"><div class="grow"><div class="t">${esc(n)}</div><div class="s" style="white-space:normal">${esc(d)}</div></div>${sw(FX(k),"setfx",n,`data-k="${k}"`)}</div>`).join("")}</div><div class="sp16"></div><div class="btn-row"><button class="btn gray" data-a="fxpreview">${IC.play}Voir un aperçu</button></div>`}));
}
function momentSheet(){
  const L=[["auto","Automatique","Suit l’heure réelle"],["matin","Matin","Aube pêche et soleil levant"],["aprem","Après-midi","Ciel bleu et plein soleil"],["apero","Apéro","L’heure dorée"],["soir","Soir","Mauve et premières étoiles"],["nuit","Nuit","Ciel étoilé et étoiles filantes"]];
  openSheet(()=>({title:"Moment affiché",body:`<div class="group">${L.map(([k,n,d])=>`<button class="row tap" data-a="setmoment" data-v="${k}"><span class="mo-ic mo-${k==="auto"?ctxInfo().moment:k}" style="width:24px;height:24px">${MO_IC[k==="auto"?(()=>{ const h=new Date().getHours(); return momentForHour(h); })():k]}</span><div class="grow"><div class="t">${n}</div><div class="s">${d}</div></div>${(S.settings.moment||"auto")===k?`<span style="color:var(--tint);width:22px;height:22px;display:grid">${IC.check}</span>`:""}</button>`).join("")}</div>`}),{short:true});
}

// ---------- Tirer pour une surprise ----------
let PULL=null;
(function(){ const pull=document.createElement("div"); pull.id="pull"; pull.innerHTML=`<span>${IC.dice}</span>`; document.body.appendChild(pull); })();
document.addEventListener("touchstart",e=>{ if(!FX("pull")||TAB!=="today"||SHEETS.length) return; const v=e.target.closest("#v-today"); if(!v||v.scrollTop>0) return; PULL={y:e.touches[0].clientY,d:0}; },{passive:true});
document.addEventListener("touchmove",e=>{ if(!PULL) return; const d=e.touches[0].clientY-PULL.y; PULL.d=d; const p=$("#pull"); if(d<=4){ p.style.opacity=0; return; }
  const k=Math.min(1,d/110); p.style.opacity=Math.min(1,d/40); p.style.transform=`translate(-50%,${Math.min(d*0.55,72)}px) rotate(${d*2.4}deg) scale(${0.6+0.4*k})`; p.classList.toggle("armed",d>110); },{passive:true});
document.addEventListener("touchend",()=>{ if(!PULL) return; const armed=PULL.d>110; PULL=null; const p=$("#pull"); p.classList.remove("armed"); p.style.opacity=0; p.style.transform=""; if(armed) setTimeout(roulette,120); },{passive:true});

// ---------- Apparition au défilement ----------
let RIO=null;
function revealIn(v){
  if(!FX("reveal")||!("IntersectionObserver" in window)) return;
  if(!RIO) RIO=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); RIO.unobserve(e.target); } }),{threshold:0.08});
  v.querySelectorAll(".content > h2.sh, .content > .sh-sub, .content > .scroller, .content > .card, .content > .group, .content > .duo, .content > .dishes, .content > .rw-card, .content > .disc, .content > .stat-grid, .content > .trophies, .content > .remind").forEach((el,i)=>{ el.classList.remove("in"); el.classList.add("rv"); el.style.setProperty("--rd",Math.min(i,6)*40+"ms"); RIO.observe(el); });
}

// ---------- Verre du labo ----------
function mixGlass(A){
  const items=A.items; let V=0,rr=0,gg=0,bb=0; items.forEach(i=>{ const ml=Math.max(mlOf(i),1), c=colOf(i.id); V+=ml; rr+=parseInt(c.slice(1,3),16)*ml; gg+=parseInt(c.slice(3,5),16)*ml; bb+=parseInt(c.slice(5,7),16)*ml; });
  const col="#"+[rr,gg,bb].map(x=>Math.round(x/(V||1)).toString(16).padStart(2,"0")).join("");
  const st=A.st, m=S.mix.m, g= st==="stirred"?"rocks": st==="long"?"highball": st==="spritz"?"vin": m==="build"?"rocks":"coupe";
  const ice= st==="stirred"?"big": (st==="long"||st==="spritz"||m==="build")?"cubes":"none";
  return glassSVG({id:"mix"+items.length,g,col,ice,ing:items,gar:""},{live:1});
}

// ---------- Cœurs ----------
function hearts(x,y){ if(!FX("confetti")) return; const box=document.createElement("div"); box.className="hearts"; document.body.appendChild(box);
  for(let k=0;k<9;k++){ const s=document.createElement("i"); s.innerHTML=IC.heartf; s.style.cssText=`left:${x}px;top:${y}px;--dx:${(Math.random()-.5)*90}px;--r:${(Math.random()-.5)*50}deg;--s:${0.6+Math.random()*0.7};animation-delay:${k*40}ms`; box.appendChild(s); }
  setTimeout(()=>box.remove(),1500); }

// ---------- Actions ----------
Object.assign(ACT,{
  setglasses:(d)=>{ S.settings.glasses=+d.v; changed(); },
  setwake:()=>{ S.settings.wake=S.settings.wake===false; changed(); },
  setremind:()=>{ S.settings.remind=S.settings.remind===false; changed(); },
  setuntested:()=>{ S.settings.untested=S.settings.untested===false; MEMO={}; changed(); },
  settings:()=>settingsSheet(), fxsheet:()=>fxSheet(), momentsheet:()=>momentSheet(),
  settheme:(d)=>{ S.settings.theme=d.v; applyTheme(); changed(); },
  setfxp:(d)=>{ S.settings.fx=Object.assign({},FX_PRESETS[d.v]); applyFx(); changed(); toast("Animations : "+{complet:"complètes",standard:"standard",reduit:"réduites"}[d.v]); },
  setfx:(d)=>{ S.settings.fx=S.settings.fx||{}; S.settings.fx[d.k]=!FX(d.k); if(S.settings.fx[d.k]) delete S.settings.fx[d.k]; applyFx(); changed(); },
  fxpreview:()=>{ closeAll(); setTimeout(()=>{ switchTab("today"); HERO_LAST=null; renderView("today"); if(FX("clink")) setTimeout(()=>clink(tonight()[0]||RMAP.negroni),1500); },450); },
  setexplore:(d)=>{ S.settings.explore=+d.v; changed(); },
  setctx:()=>{ S.settings.ctx=S.settings.ctx===false; changed(); },
  setcur:(d)=>{ S.settings.cur=d.v; changed(); },
  unit2:(d)=>{ S.settings.unit=d.v; changed(); },
  resetlearn:()=>{ const bak={mw:S.mw,mwN:S.mwN,skips:S.skips,opens:S.opens,heroLog:S.heroLog}; delete S.mw; delete S.mwN; delete S.skips; delete S.opens; delete S.heroLog; MODEL=null; changed(); toast("Apprentissage réinitialisé, tes notes sont conservées",{action:{label:"Annuler",fn:()=>{ Object.assign(S,bak); MODEL=null; changed(); }}}); },
  setmoment:(d)=>{ S.settings.moment=d.v; save(); applyAmbient(); HERO_LAST=null; changed(); if(SHEETS.length&&SHEETS[SHEETS.length-1].el.querySelector('[data-a="setmoment"][data-v]')&&SHEETS.length>1) closeSheet(); }
});
const _setamb=ACT.setamb; ACT.setamb=(d,t)=>{ _setamb(d,t); applyFx(); };
const _fav=ACT.fav; ACT.fav=(d,t)=>{ const adding=!S.fav.includes(d.id); _fav(d,t); if(adding&&t){ const b=t.getBoundingClientRect(); hearts(b.left+b.width/2,b.top); } };
const _rlagain=ACT.rlagain; ACT.rlagain=(d,t)=>{ if(RL&&RL.pick){ S.skips=S.skips||{}; const x=S.skips[RL.pick.id]||{n:0}; S.skips[RL.pick.id]={n:x.n+1,t:Date.now()}; save(); } _rlagain(d,t); };
const _switchTab=switchTab;
switchTab=function(t){ const prev=TAB; _switchTab(t); if(prev!==t) revealIn($("#v-"+t)); };
ACT.tab=(d)=>{ if(d.f){ CF.main=d.f; } dirty.cocktails=1; switchTab(d.t); };
REDUCED.addEventListener&&REDUCED.addEventListener("change",()=>{ applyFx(); renderAll(); });

fixState(); applyTheme();
init();
applyFx(); window.__ZT=performance.now();
</script></body></html>
