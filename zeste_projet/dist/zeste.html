<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)"><title>Zeste</title><style>
:root{
  --bg:#F2F2F7; --bg2:#FFFFFF; --bg3:#F7F7FA; --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.07);
  --label:#000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.32); --sep:rgba(60,60,67,.22);
  --tint:#A15A00; --tint-bg:rgba(161,90,0,.1); --on-tint:#fff;
  --green:#248A3D; --red:#D70015; --orange:#C35A00;
  --bar:rgba(248,248,250,.82); --glass-stroke:rgba(0,0,0,.34); --glass-fill:rgba(255,255,255,.55);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --serif:ui-serif,"New York","Iowan Old Style","Palatino",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --rounded:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,sans-serif;
  color-scheme:light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000; --bg2:#1C1A18; --bg3:#262320; --fill:rgba(128,120,110,.26); --fill2:rgba(128,120,110,.14);
    --label:#fff; --label2:rgba(240,232,222,.62); --label3:rgba(240,232,222,.3); --sep:rgba(120,110,100,.42);
    --tint:#FFB340; --tint-bg:rgba(255,179,64,.14); --on-tint:#1A1206;
    --green:#30D158; --red:#FF453A; --orange:#FF9F0A;
    --bar:rgba(22,20,18,.8); --glass-stroke:rgba(255,245,230,.5); --glass-fill:rgba(255,245,230,.06);
    --shadow:none;
  }
}
:root[data-theme="dark"]{
    --bg:#000; --bg2:#1C1A18; --bg3:#262320; --fill:rgba(128,120,110,.26); --fill2:rgba(128,120,110,.14);
    --label:#fff; --label2:rgba(240,232,222,.62); --label3:rgba(240,232,222,.3); --sep:rgba(120,110,100,.42);
    --tint:#FFB340; --tint-bg:rgba(255,179,64,.14); --on-tint:#1A1206;
    --green:#30D158; --red:#FF453A; --orange:#FF9F0A;
    --bar:rgba(22,20,18,.8); --glass-stroke:rgba(255,245,230,.5); --glass-fill:rgba(255,245,230,.06);
    --shadow:none;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--label);font-family:var(--sans);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:6px}
#app{position:relative;height:100%}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));display:none;overscroll-behavior-y:contain}
.view.active{display:block}
.content{max-width:720px;margin:0 auto}

/* barre de navigation compacte */
.navbar{position:sticky;top:0;z-index:20;height:44px;display:flex;align-items:center;justify-content:center;padding:0 12px;background:transparent;transition:background .2s;max-width:none}
.navbar .nb-title{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s}
.navbar .nb-right{position:absolute;right:8px;top:0;height:44px;display:flex;align-items:center;gap:4px}
.navbar .nb-left{position:absolute;left:8px;top:0;height:44px;display:flex;align-items:center}
.view.scrolled .navbar{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.view.scrolled .navbar .nb-title{opacity:1}
.icon-btn{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:var(--tint)}
.icon-btn svg{width:22px;height:22px}
.icon-btn.filled{background:var(--fill)}

.eyebrow{padding:0 20px;color:var(--label2);font-size:15px;font-weight:600;margin-top:-4px}
.lt{font-family:var(--serif);font-weight:700;font-size:34px;letter-spacing:-.01em;line-height:1.1;padding:2px 20px 10px;margin:0}
h2.sh{font-size:22px;font-weight:700;margin:26px 20px 10px;display:flex;align-items:baseline;justify-content:space-between;letter-spacing:-.01em}
h2.sh .more{font-size:17px;font-weight:400;color:var(--tint)}
.sh-sub{color:var(--label2);font-size:15px;margin:-6px 20px 10px}
.gh{font-size:13px;color:var(--label2);margin:22px 36px 7px;line-height:1.3}
.gf{font-size:13px;color:var(--label2);margin:7px 36px 0;line-height:1.35}
p.body{margin:0 20px;color:var(--label2);font-size:15px}

/* listes groupées */
.group{background:var(--bg2);border-radius:12px;margin:0 16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:9px 16px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);height:.5px;background:var(--sep)}
.row.tap:active{background:var(--fill2)}
.row .grow{flex:1;min-width:0}
.row .t{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t.serif{font-family:var(--serif);font-weight:600}
.row .s{font-size:14px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .val{color:var(--label2);font-size:17px;white-space:nowrap}
.chev{width:8px;height:13px;color:var(--label3);flex:none}
.row .thumb{width:42px;height:52px;flex:none;display:grid;place-items:center}
.row .thumb svg{width:100%;height:100%}

/* cartes et boutons */
.card{background:var(--bg2);border-radius:18px;margin:0 16px;padding:16px;box-shadow:var(--shadow)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;padding:0 20px;font-size:17px;font-weight:600;background:var(--tint);color:var(--on-tint);width:100%}
.btn.sec{background:var(--tint-bg);color:var(--tint)}
.btn.gray{background:var(--fill);color:var(--label)}
.btn.small{height:36px;border-radius:18px;font-size:15px;padding:0 14px;width:auto}
.btn.danger{background:transparent;color:var(--red);font-weight:400}
.btn:active{opacity:.75}
.btn svg{width:20px;height:20px}
.btn-row{display:flex;gap:10px;margin:0 16px}
.btn-row .btn{flex:1}
.link{color:var(--tint)}

/* puces et contrôle segmenté */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 13px;border-radius:16px;background:var(--fill);font-size:15px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--label);color:var(--bg2)}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:0 16px;position:relative}
.seg button{flex:1;height:30px;border-radius:7px;font-size:14px;font-weight:500;z-index:1}
.seg button.on{background:var(--bg2);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button.on{background:#5A544E}}
:root[data-theme="dark"] .seg button.on{background:#5A544E}

.search{margin:0 16px 12px;display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:11px;height:38px;padding:0 10px;color:var(--label2)}
.search svg{width:17px;height:17px;flex:none}
.search input{flex:1;border:0;background:transparent;outline:none;font-size:17px;color:var(--label);min-width:0}
.search input::placeholder{color:var(--label2)}

/* accueil */
.hero{margin:6px 16px 0;border-radius:24px;overflow:hidden;position:relative;background:var(--bg2);box-shadow:var(--shadow);text-align:center;padding:22px 20px 20px}
.hero .glow{position:absolute;inset:0;opacity:.55;pointer-events:none}
.hero .hg{position:relative;height:190px;display:grid;place-items:center}
.hero .hg svg{height:100%;width:auto;filter:drop-shadow(0 14px 22px rgba(0,0,0,.14))}
.hero .kick{position:relative;font-size:14px;color:var(--label2);font-weight:600;margin-top:8px}
.hero .hn{position:relative;font-family:var(--serif);font-size:30px;font-weight:700;margin:2px 0 4px;letter-spacing:-.01em}
.hero .hr{position:relative;font-size:15px;color:var(--label2);margin:0 auto 16px;max-width:30ch}
.hero .btn-row{margin:0}
.scroller{display:flex;gap:12px;overflow-x:auto;padding:0 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.tile{flex:none;width:148px;scroll-snap-align:start;background:var(--bg2);border-radius:18px;padding:12px 12px 12px;text-align:left;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile .tg{height:104px;display:grid;place-items:center;border-radius:12px;margin-bottom:10px;position:relative}
.tile .tg svg{height:92px;width:auto;position:relative}
.tile .tn{font-family:var(--serif);font-weight:600;font-size:16px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .ts{font-size:13px;color:var(--label2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile:active{transform:scale(.98)}
.dice-btn{margin:22px 16px 0;height:64px;border-radius:20px;background:var(--bg2);box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;padding:0 18px;width:calc(100% - 32px);text-align:left}
.dice-btn .di{width:38px;height:38px;border-radius:11px;background:var(--tint);color:var(--on-tint);display:grid;place-items:center;flex:none}
.dice-btn .di svg{width:22px;height:22px}
.dice-btn .dt{font-weight:600}
.dice-btn .ds{font-size:14px;color:var(--label2)}
.buy{display:flex;gap:14px;align-items:center}
.buy .bb{width:46px;height:70px;flex:none}
.buy .bt{font-weight:600;font-size:17px}
.buy .bs{font-size:14px;color:var(--label2);margin-top:2px}
.season .sm{font-family:var(--serif);font-size:22px;font-weight:600;margin-bottom:2px}
.season .sp{font-size:15px;color:var(--label2);margin-bottom:12px}
.mini-list{display:flex;gap:10px}
.mini{flex:1;min-width:0;text-align:center;border-radius:14px;background:var(--fill2);padding:10px 6px}
.mini svg{height:54px;width:auto}
.mini .mn{font-size:13px;font-weight:600;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* statut, étoiles, badges */
.dot{width:8px;height:8px;border-radius:4px;flex:none}
.dot.ok{background:var(--green)} .dot.sub{background:var(--orange)} .dot.no{background:var(--label3)}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--fill);color:var(--label2);white-space:nowrap}
.badge.tint{background:var(--tint-bg);color:var(--tint)}
.badge.green{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.badge.red{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.stars{display:flex;gap:4px}
.stars button{width:34px;height:34px;display:grid;place-items:center;color:var(--label3)}
.stars button.on{color:var(--tint)}
.stars svg{width:28px;height:28px}
.stars.sm{gap:1px}
.stars.sm svg{width:12px;height:12px}
.stars.sm span{color:var(--label3);display:grid}
.stars.sm span.on{color:var(--tint)}

/* niveaux de bouteilles */
.lvl{display:flex;align-items:flex-end;gap:3px;height:32px;padding:0 2px;flex:none}
.lvl button{width:13px;height:32px;display:flex;align-items:flex-end;justify-content:center}
.lvl button i{display:block;width:7px;border-radius:2px;background:var(--fill)}
.lvl button.on i{background:var(--tint)}
.lvl.empty button i{background:color-mix(in srgb,var(--red) 30%,transparent)}
.lvl-big{display:flex;gap:8px;justify-content:space-between}
.lvl-big button{flex:1;border-radius:14px;background:var(--fill2);padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--label2)}
.lvl-big button.on{background:var(--tint-bg);color:var(--tint);box-shadow:inset 0 0 0 1.5px var(--tint)}
.lvl-big svg{width:26px;height:44px}
.switch{position:relative;width:51px;height:31px;flex:none;border-radius:16px;background:var(--fill);transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .25s cubic-bezier(.3,.7,.4,1)}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(20px)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 16px}
.stat{background:var(--bg2);border-radius:16px;padding:12px 12px 10px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--rounded);font-size:28px;font-weight:700;line-height:1.1;color:var(--label)}
.stat span{font-size:13px;color:var(--label2)}
.stat.t b{color:var(--tint)}

/* feuilles modales */
#sheets{position:fixed;inset:0;pointer-events:none;z-index:50}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.28);opacity:0;transition:opacity .3s;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + 12px);max-width:720px;margin:0 auto;background:var(--bg);border-radius:14px 14px 0 0;transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.25,1);pointer-events:auto;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet.short{top:auto;max-height:calc(100% - env(safe-area-inset-top,0px) - 40px)}
.sheet.open{transform:translateY(0)}
.sheet.drag{transition:none}
.backdrop.open{opacity:1}
.sheet-head{flex:none;position:relative;height:52px;display:flex;align-items:center;justify-content:center;touch-action:none}
.sheet-head::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--label3)}
.sheet-head .st{font-weight:600;font-size:17px;margin-top:8px;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head .sl,.sheet-head .sr{position:absolute;top:10px;height:40px;display:flex;align-items:center}
.sheet-head .sl{left:10px}.sheet-head .sr{right:10px}
.close-x{width:30px;height:30px;border-radius:15px;background:var(--fill);display:grid;place-items:center;color:var(--label2)}
.close-x svg{width:12px;height:12px}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(30px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.sheet.short .sheet-body{flex:none}

/* fiche cocktail */
.dhero{position:relative;margin:-52px 0 0;padding:58px 20px 18px;text-align:center;overflow:hidden}
.dhero .glow{position:absolute;inset:0;pointer-events:none}
.dhero .dg{position:relative;height:170px;display:grid;place-items:center}
.dhero .dg svg{height:100%;width:auto;filter:drop-shadow(0 14px 20px rgba(0,0,0,.14))}
.dhero h1{position:relative;font-family:var(--serif);font-size:32px;line-height:1.1;margin:10px 0 8px;letter-spacing:-.01em}
.dhero .tags{position:relative;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.status{margin:14px 16px 0;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:15px;background:var(--bg2)}
.status svg{width:20px;height:20px;flex:none;margin-top:1px}
.status.ok{color:var(--green)} .status.ok span{color:var(--label)}
.status.no svg{color:var(--orange)}
.acts{display:flex;gap:10px;margin:14px 16px 0}
.acts .btn{flex:1}
.acts .sq{flex:none;width:50px;padding:0}
.rate-box{display:flex;align-items:center;justify-content:space-between}
.ing-line{display:flex;align-items:baseline;gap:12px;padding:11px 16px;position:relative;width:100%;text-align:left}
.ing-line+.ing-line::before{content:"";position:absolute;top:0;right:0;left:16px;height:.5px;background:var(--sep)}
.ing-line .q{font-family:var(--rounded);font-weight:600;min-width:64px;font-variant-numeric:tabular-nums}
.ing-line .n{flex:1}
.ing-line.miss .n{color:var(--orange)}
.ing-line .o{font-size:13px;color:var(--label2)}
.stepper{display:flex;align-items:center;background:var(--fill);border-radius:9px;height:32px;flex:none}
.stepper button{width:38px;height:32px;display:grid;place-items:center;color:var(--label)}
.stepper button svg{width:14px;height:14px}
.stepper span{min-width:34px;text-align:center;font-weight:600;font-size:15px;font-family:var(--rounded)}
.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{position:relative;padding:12px 16px 12px 54px;font-size:16px}
.steps li+li::before{content:"";position:absolute;top:0;right:0;left:54px;height:.5px;background:var(--sep)}
.steps li::after{counter-increment:s;content:counter(s);position:absolute;left:16px;top:11px;width:26px;height:26px;border-radius:13px;background:var(--tint-bg);color:var(--tint);font-weight:700;font-size:14px;display:grid;place-items:center;font-family:var(--rounded)}
.hist{font-family:var(--serif);font-size:17px;line-height:1.55;margin:0;color:var(--label)}
.metrics{display:flex;gap:8px}
.metric{flex:1;background:var(--fill2);border-radius:12px;padding:9px 10px}
.metric b{display:block;font-family:var(--rounded);font-size:21px;font-weight:700;line-height:1.1}
.metric span{font-size:12px;color:var(--label2)}
.prof{display:flex;gap:14px;align-items:center}
.prof svg.radar{width:150px;height:150px;flex:none}
details.tip{padding:0}
details.tip summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;font-size:16px}
details.tip summary::-webkit-details-marker{display:none}
details.tip summary .chev{transition:transform .2s;margin-left:auto}
details.tip[open] summary .chev{transform:rotate(90deg)}
details.tip p{margin:0;padding:0 16px 14px;color:var(--label2);font-size:15px}
details.tip+details.tip{border-top:.5px solid var(--sep)}
textarea.note{width:100%;min-height:84px;border:0;background:transparent;resize:vertical;outline:none;padding:12px 16px;font-size:16px;display:block}

/* labo */
.mix-row{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 16px;position:relative}
.mix-row+.mix-row::before{content:"";position:absolute;top:0;right:0;left:16px;height:.5px;background:var(--sep)}
.mix-row .n{flex:1;min-width:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mix-row .rm{width:30px;height:30px;display:grid;place-items:center;color:var(--label3)}
.mix-row .rm svg{width:12px;height:12px}
.zone{margin-top:6px;height:5px;border-radius:3px;background:var(--fill);position:relative}
.zone i{position:absolute;top:0;bottom:0;border-radius:3px;background:color-mix(in srgb,var(--green) 40%,transparent)}
.zone b{position:absolute;top:-3px;width:3px;height:11px;border-radius:2px;background:var(--label);margin-left:-1.5px}
.diag{display:flex;gap:12px;padding:12px 16px;position:relative;align-items:flex-start}
.diag+.diag::before{content:"";position:absolute;top:0;right:0;left:48px;height:.5px;background:var(--sep)}
.diag .di{width:22px;height:22px;flex:none;margin-top:1px}
.diag .di.ok{color:var(--green)} .diag .di.warn{color:var(--orange)}
.diag .dt{flex:1;font-size:15px}
.diag .dt b{display:block;font-size:16px;margin-bottom:2px}
.diag .btn{margin-top:8px}
.pair{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;position:relative}
.pair+.pair::before{content:"";position:absolute;top:0;right:0;left:16px;height:.5px;background:var(--sep)}
.pair .grow{flex:1;min-width:0}
.pair .pn{font-weight:600;font-size:16px}
.pair .pr{font-size:14px;color:var(--label2)}
.prep-ring{width:44px;height:44px;flex:none}
.empty{text-align:center;padding:26px 30px 10px;color:var(--label2);font-size:15px}
.empty svg{width:64px;height:64px;color:var(--label3);margin-bottom:8px}
.empty b{display:block;color:var(--label);font-size:19px;margin-bottom:4px;font-family:var(--serif)}

/* profil */
.trophies{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 16px}
.trophy{background:var(--bg2);border-radius:16px;padding:12px 8px 10px;text-align:center;box-shadow:var(--shadow)}
.trophy svg{width:56px;height:56px}
.trophy .tn{font-size:13px;font-weight:600;margin-top:4px;line-height:1.2}
.trophy .tp{font-size:11px;color:var(--label2);margin-top:2px}
.trophy.locked svg{opacity:.45}
.bars .bar-row{display:flex;align-items:center;gap:10px;padding:7px 16px}
.bars .bar-row .bl{width:96px;font-size:14px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .bar-row .bt{flex:1;height:10px;border-radius:5px;background:var(--fill2);overflow:hidden}
.bars .bar-row .bt i{display:block;height:100%;border-radius:5px;background:var(--tint)}
.bars .bar-row .bn{width:24px;text-align:right;font-size:14px;color:var(--label2);font-family:var(--rounded)}
.fmap{margin:0 16px;background:var(--bg2);border-radius:18px;padding:10px;box-shadow:var(--shadow)}
.fmap svg{width:100%;height:auto;display:block}

/* barre d’onglets */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;padding:6px 4px env(safe-area-inset-bottom,0px);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep)}
.tabbar button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;height:50px;color:var(--label2);font-size:10px;font-weight:500;padding-top:2px}
.tabbar button svg{width:27px;height:27px}
.tabbar button.on{color:var(--tint)}
.tabbar button.on svg .fillme{fill:currentColor;fill-opacity:.18}

/* surcouches plein écran */
#overlay{position:fixed;inset:0;z-index:80;display:none;background:var(--bg)}
#overlay.open{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:ovIn .35s cubic-bezier(.2,.9,.25,1)}
@keyframes ovIn{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
.ov-top{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex:none}
.ov-top .ot{font-weight:600;font-family:var(--serif);font-size:18px}
.ov-body{flex:1;overflow-y:auto;padding:8px 24px 20px;display:flex;flex-direction:column}
.ov-bottom{flex:none;display:flex;gap:10px;padding:10px 16px 12px}
.ov-bottom .btn{height:58px;font-size:19px;border-radius:18px}
.bm-count{font-size:14px;color:var(--label2);font-weight:600;margin-bottom:8px;font-family:var(--rounded)}
.bm-text{font-size:28px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
.bm-list{margin-top:18px}
.bm-item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:.5px solid var(--sep);font-size:22px;width:100%;text-align:left}
.bm-item .ck{width:30px;height:30px;border-radius:15px;box-shadow:inset 0 0 0 2px var(--label3);flex:none;display:grid;place-items:center;color:var(--on-tint)}
.bm-item.done .ck{background:var(--green);box-shadow:none}
.bm-item.done .bn{color:var(--label2);text-decoration:line-through}
.bm-item .bq{font-family:var(--rounded);font-weight:700;min-width:88px}
.timer{margin:28px auto 18px;width:210px;height:210px;position:relative;display:grid;place-items:center}
.timer svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.timer .tv{font-family:var(--rounded);font-size:54px;font-weight:700;font-variant-numeric:tabular-nums}
.timer .tl{position:absolute;bottom:52px;font-size:14px;color:var(--label2)}
.roul{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.roul .rg{height:230px;display:grid;place-items:center;transition:transform .2s}
.roul .rg svg{height:100%;width:auto;filter:drop-shadow(0 14px 22px rgba(0,0,0,.16))}
.roul .rn{font-family:var(--serif);font-size:34px;font-weight:700;min-height:44px}
.roul .rs{color:var(--label2);font-size:15px;min-height:20px}
.spin .rg{animation:wob .12s infinite alternate}
@keyframes wob{from{transform:translateY(-3px) rotate(-3deg)}to{transform:translateY(3px) rotate(3deg)}}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--label);color:var(--bg2);padding:11px 18px;border-radius:22px;font-size:15px;font-weight:600;opacity:0;transition:all .3s;z-index:100;pointer-events:none;max-width:86%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.muted{color:var(--label2)}
.sp8{height:8px}.sp16{height:16px}.sp24{height:24px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== V2 : hiérarchie, segments, animations ===== */
h2.sh{font-size:22px;margin:34px 20px 4px}
.sh-sub{margin:0 20px 12px}
.sheet-body h2.sh{margin-top:28px}
.lt{font-size:36px}
.hero{padding:26px 20px 20px}
.hero .hg{height:210px}
.hero .hn{font-size:32px}
.pills{display:flex;gap:8px;justify-content:center;position:relative;margin:-4px 0 16px;flex-wrap:wrap}
.pill{height:26px;padding:0 11px;border-radius:13px;background:var(--fill2);font-size:13px;font-weight:600;color:var(--label2);display:inline-flex;align-items:center;gap:6px}
.pill i{width:7px;height:7px;border-radius:4px;display:block}
.toolbar{display:flex;gap:10px;margin:0 16px 10px;align-items:center}
.toolbar .seg{margin:0;flex:1}
.fbtn{height:34px;padding:0 12px;border-radius:9px;background:var(--fill);font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;flex:none;color:var(--label)}
.fbtn svg{width:16px;height:16px}
.fbtn b{min-width:18px;height:18px;border-radius:9px;background:var(--tint);color:var(--on-tint);font-size:11px;display:grid;place-items:center;padding:0 5px}
.active-f{display:flex;gap:6px;flex-wrap:wrap;margin:0 16px 8px}
.active-f button{height:28px;padding:0 10px;border-radius:14px;background:var(--tint-bg);color:var(--tint);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.active-f button svg{width:9px;height:9px}
.list-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 20px 8px}
.list-h b{font-size:17px;font-weight:700}
.list-h span{font-size:14px;color:var(--label2)}
.more-row{justify-content:center;color:var(--tint);font-weight:600}
.segchips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;scrollbar-width:none;margin-bottom:6px}
.segchips::-webkit-scrollbar{display:none}
.segchips .chip i{width:8px;height:8px;border-radius:4px;display:block}
.segchips .chip.on i{box-shadow:0 0 0 1.5px var(--bg2)}
.ing-sec{display:flex;align-items:center;gap:8px;padding:12px 16px 4px;font-size:13px;font-weight:700;color:var(--label2);position:relative}
.ing-sec i{width:8px;height:8px;border-radius:4px}
.ing-sec span{margin-left:auto;font-weight:500}
.ing-sec+.ing-line::before{display:none}
.ing-line.basic .q,.ing-line.basic .n{color:var(--label2)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin:16px 16px 0;background:var(--sep);border-radius:14px;overflow:hidden}
.facts div{background:var(--bg2);padding:10px 6px;text-align:center}
.facts b{display:block;font-family:var(--rounded);font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.facts span{font-size:11px;color:var(--label2)}
.sheet-foot{flex:none;display:flex;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep)}
.sheet-foot .btn{height:50px}
.sheet-foot .sq{flex:none;width:50px;padding:0}
.sheet.has-foot .sheet-body{padding-bottom:20px}
.basics{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.basics span{height:28px;padding:0 10px;border-radius:14px;background:var(--fill2);font-size:13px;display:inline-flex;align-items:center;color:var(--label2)}
.starter{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.last-row .s{font-variant-numeric:tabular-nums}
#toast{display:flex;align-items:center;gap:10px}
#toast svg{width:30px;height:30px;flex:none}
#toast .tbtn{color:var(--tint);font-weight:700;padding:0 2px 0 6px;pointer-events:auto}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #toast .tbtn{color:#A15A00}}
#toast.show.trophy{animation:tpop .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes tpop{0%{transform:translate(-50%,30px) scale(.8)}100%{transform:translate(-50%,0) scale(1)}}

/* mouvements */
.view.enter{animation:vin .32s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn,.tile,.chip,.mini,.dice-btn,.fbtn,.card.buy,.stars button,.icon-btn{transition:transform .18s cubic-bezier(.3,.7,.4,1),opacity .18s,background .2s}
.btn:active,.tile:active,.chip:active,.mini:active,.dice-btn:active,.fbtn:active,.card.buy:active{transform:scale(.965)}
.row.tap{transition:background .15s}
svg.pour .liq{animation:pour 1.25s cubic-bezier(.22,.8,.25,1) .12s both}
@keyframes pour{from{transform:translateY(62px)}to{transform:none}}
svg.pour .ice{animation:drop .6s cubic-bezier(.3,1.35,.55,1) .75s both}
@keyframes drop{from{transform:translateY(-46px);opacity:0}to{transform:none;opacity:1}}
svg.pour .fz circle{animation:bub 2.4s ease-in 1.2s infinite both}
@keyframes bub{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-30px);opacity:0}}
svg.pour .garn{transform-box:fill-box;transform-origin:center;animation:gpop .5s cubic-bezier(.3,1.7,.5,1) 1.15s both}
@keyframes gpop{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
.stars button.pop svg{animation:spop .45s cubic-bezier(.3,1.8,.5,1) both}
.stars button.pop:nth-child(2) svg{animation-delay:.04s}.stars button.pop:nth-child(3) svg{animation-delay:.08s}.stars button.pop:nth-child(4) svg{animation-delay:.12s}.stars button.pop:nth-child(5) svg{animation-delay:.16s}
@keyframes spop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:none}}
.hpop svg{animation:spop .45s cubic-bezier(.3,1.8,.5,1)}
.lvl button i{transition:background .25s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.lvl button.bump i{animation:lbump .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes lbump{0%{transform:scaleY(.4)}100%{transform:none}}
.tick{animation:tick .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes tick{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:none}}
.stat b{display:inline-block;transform-origin:left center}
.ov-body.fwd{animation:sfwd .32s cubic-bezier(.2,.8,.2,1)}
.ov-body.back{animation:sback .32s cubic-bezier(.2,.8,.2,1)}
@keyframes sfwd{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes sback{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.timer.done{animation:tick .6s cubic-bezier(.3,1.6,.5,1) 2}
.bm-item .ck{transition:background .2s,box-shadow .2s}
.hero .kick,.hero .hn,.hero .hr,.hero .pills,.hero .btn-row{animation:vin .5s cubic-bezier(.2,.8,.2,1) both}
.hero .hn{animation-delay:.08s}.hero .hr{animation-delay:.14s}.hero .pills{animation-delay:.18s}.hero .btn-row{animation-delay:.22s}
.hero.still .kick,.hero.still .hn,.hero.still .hr,.hero.still .pills,.hero.still .btn-row{animation:none!important}
.stat b{display:block;width:fit-content}
.starter .chip{color:var(--label);background:var(--bg3)}

/* ===== V3 : finitions ===== */
.gh{margin:22px 32px 7px}.gf{margin:8px 32px 0}
.eyebrow{text-transform:none;letter-spacing:0}
.tile{position:relative}
.tmatch{position:absolute;top:10px;right:10px;z-index:1;height:20px;padding:0 7px;border-radius:10px;background:var(--bg2);color:var(--tint);font-family:var(--rounded);font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.pill.match{background:var(--tint-bg);color:var(--tint)}
.hero .hg{will-change:transform;transition:transform .05s linear}
.hero .glow{transition:opacity .1s}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:26px 16px 0}
.duo-c{background:var(--bg2);border-radius:20px;padding:16px 14px 14px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:flex-start;min-height:138px;transition:transform .18s cubic-bezier(.3,.7,.4,1)}
.duo-c:active{transform:scale(.965)}
.duo-c .di{width:40px;height:40px;border-radius:12px;background:var(--tint);color:var(--on-tint);display:grid;place-items:center;margin-bottom:auto}
.duo-c .di svg{width:22px;height:22px}
.duo-c .db{width:28px;height:44px;margin-bottom:auto}
.duo-c .dt{font-weight:700;font-size:16px;margin-top:12px;line-height:1.2}
.duo-c .ds{font-size:13px;color:var(--label2);margin-top:2px;line-height:1.25}
.season .sp{font-size:15px;color:var(--label);margin-bottom:14px}
.card,.group,.stat,.tile,.duo-c,.hero,.trophy,.fmap{box-shadow:var(--shadow)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card,:root:not([data-theme="light"]) .group,:root:not([data-theme="light"]) .tile,:root:not([data-theme="light"]) .duo-c,:root:not([data-theme="light"]) .hero,:root:not([data-theme="light"]) .stat{box-shadow:inset 0 0 0 .5px rgba(255,240,220,.07)}}
.row .t.serif{font-size:17px;letter-spacing:-.005em}
.ing-line{align-items:center}
.ing-line .q{min-width:72px;color:var(--label)}
.rate-box .stars button{width:36px;height:36px}
.bl{transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:200}
.confetti i{position:absolute;width:7px;height:12px;border-radius:2px;margin:-4px 0 0 -4px;animation:conf 1.3s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes conf{0%{transform:translate(0,0) rotate(0);opacity:1}70%{opacity:1}100%{transform:translate(var(--x),calc(var(--y) + 260px)) rotate(var(--r));opacity:0}}
.tabbar button.bounce svg{animation:tb .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes tb{0%{transform:scale(.8)}60%{transform:scale(1.15)}100%{transform:none}}
.timer .shk{position:absolute;top:44px;width:26px;height:26px;color:var(--tint)}
.timer .shk svg{width:100%;height:100%}
.timer.run .shk{animation:shk .16s ease-in-out infinite alternate}
@keyframes shk{from{transform:translateY(-3px) rotate(-14deg)}to{transform:translateY(3px) rotate(14deg)}}
.timer .tv{margin-top:14px}
.sheet-foot .btn.sec{background:var(--fill)}
.sheet-foot .btn.sec.sq{color:var(--tint)}
.facts{box-shadow:var(--shadow)}
.dhero h1{font-size:34px}
.list-h{margin:26px 20px 8px}
.hero .hg{transform-origin:50% 100%;transition:none}
.timer .shk{top:34px;width:34px;height:34px}
.ing-line .n{display:flex;flex-direction:column;min-width:0}
.ing-line .n small{font-size:13px;color:var(--label2);margin-top:1px;font-weight:400}
.ing-line.miss .n small{color:var(--label2)}
.ing-line .badge{flex:none}

/* ===== V4 : quiz, rappels, découverte, vie ===== */
.qz-prog{display:flex;gap:5px;flex:1;margin:0 14px}
.qz-prog i{flex:1;height:4px;border-radius:2px;background:var(--fill);position:relative;overflow:hidden}
.qz-prog i.done{background:var(--tint)}
.qz-prog i.now::after{content:"";position:absolute;inset:0;background:var(--tint);animation:qzfill .5s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
@keyframes qzfill{from{transform:scaleX(0)}to{transform:scaleX(.5)}}
.qz-prog i.now::after{transform:scaleX(.5)}
.qz-q{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.qz-opts{display:grid;grid-template-columns:1fr;gap:10px;margin-top:22px}
.qz-opts.many{grid-template-columns:1fr 1fr}
.qz-o{position:relative;display:flex;align-items:center;gap:14px;padding:12px 16px 12px 12px;border-radius:18px;background:var(--bg2);box-shadow:var(--shadow),inset 0 0 0 1.5px transparent;text-align:left;animation:qzin .45s cubic-bezier(.2,.8,.2,1) both;transition:transform .18s,box-shadow .2s,background .2s}
.qz-opts.many .qz-o{flex-direction:column;align-items:flex-start;gap:6px;padding:12px}
.qz-o:active{transform:scale(.97)}
.qz-o.on{background:var(--tint-bg);box-shadow:inset 0 0 0 2px var(--tint)}
.qz-o.on .qz-g svg{animation:spop .45s cubic-bezier(.3,1.8,.5,1)}
.qz-g{width:46px;height:58px;flex:none;display:grid;place-items:center}
.qz-g svg{height:100%;width:auto}
.qz-l{font-size:17px;font-weight:600;line-height:1.25}
.qz-ck{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:12px;background:var(--tint);color:var(--on-tint);display:grid;place-items:center;animation:spop .35s cubic-bezier(.3,1.8,.5,1)}
.qz-ck svg{width:15px;height:15px}
@keyframes qzin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.qz-end{align-items:center;justify-content:center;text-align:center}
.qz-badge{width:64px;height:64px;border-radius:20px;background:var(--tint);color:var(--on-tint);display:grid;place-items:center;margin:10px auto 14px;animation:spop .6s cubic-bezier(.3,1.8,.5,1)}
.qz-badge svg{width:34px;height:34px}
.qz-style{font-family:var(--serif);font-size:32px;font-weight:700;line-height:1.15;animation:vin .6s cubic-bezier(.2,.8,.2,1) .15s both}
.qz-tops{display:flex;gap:10px;margin-top:26px;width:100%}
.qz-top{flex:1;background:var(--bg2);border-radius:18px;padding:12px 6px 10px;box-shadow:var(--shadow);animation:qzin .5s cubic-bezier(.2,.8,.2,1) both}
.qz-tg{height:86px;display:grid;place-items:center}.qz-tg svg{height:100%;width:auto}
.qz-tn{font-family:var(--serif);font-weight:600;font-size:15px;margin-top:6px;line-height:1.2}
.qz-tm{font-family:var(--rounded);font-weight:700;color:var(--tint);font-size:14px;margin-top:2px}

.remind{margin:22px 16px 0;border-radius:20px;background:var(--bg2);box-shadow:var(--shadow);position:relative;overflow:hidden;max-height:200px;transition:max-height .45s cubic-bezier(.2,.8,.2,1) .35s,margin .45s .35s,opacity .3s .35s;animation:vin .5s cubic-bezier(.2,.8,.2,1) both}
.rm-in{display:flex;align-items:center;gap:12px;padding:14px 12px 12px 14px;transition:opacity .25s,transform .3s}
.rm-g{width:46px;height:58px;flex:none}.rm-g svg{width:100%;height:100%}
.rm-k{font-size:13px;color:var(--label2);font-weight:600}
.rm-n{display:inline-grid;place-items:center;min-width:20px;height:18px;border-radius:9px;background:var(--fill);font-size:11px;padding:0 5px;margin-left:4px}
.rm-t{font-family:var(--serif);font-size:19px;font-weight:700;margin:1px 0 4px}
.remind .stars{gap:2px;margin-left:-6px}
.remind .stars button{width:36px;height:36px}
.remind .stars button.on svg{color:var(--tint)}
.rm-x{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:14px;background:var(--fill2);color:var(--label2);display:grid;place-items:center}
.rm-x svg{width:10px;height:10px}
.rm-done{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;color:var(--green);opacity:0;transform:scale(.9);transition:opacity .3s .2s,transform .4s cubic-bezier(.3,1.6,.5,1) .2s;pointer-events:none}
.rm-done svg{width:26px;height:26px}
.remind.done .rm-in{opacity:0;transform:scale(.96)}
.remind.done .rm-done{opacity:1;transform:none}
.remind.done .stars button.on svg{animation:spop .45s cubic-bezier(.3,1.8,.5,1)}
.remind.done,.remind.gone{max-height:0;margin-top:0;opacity:0}
.remind.gone{transition-delay:0s}

.disc{margin:0 16px;perspective:1200px;cursor:pointer}
.disc-in{position:relative;min-height:216px;transition:transform .7s cubic-bezier(.3,1.2,.4,1);transform-style:preserve-3d}
.disc.flipped .disc-in{transform:rotateY(180deg)}
.disc-f,.disc-b{position:absolute;inset:0;border-radius:22px;padding:18px 20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:var(--shadow);overflow:hidden}
.disc-f{background:var(--bg2);display:flex;flex-direction:column}
.disc-f p{font-family:var(--serif);font-size:16.5px;line-height:1.5;margin:0;flex:1;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.disc-q{font-family:var(--serif);font-size:54px;line-height:.6;color:var(--tint);height:22px}
.disc-hint{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--tint);margin-top:10px}
.disc-hint svg{width:16px;height:16px;animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.2) rotate(18deg)}}
.disc-b{transform:rotateY(180deg);background:radial-gradient(circle at 50% 30%, color-mix(in srgb,var(--c) 45%,transparent), transparent 70%),var(--bg2);display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;gap:2px}
.disc-g{height:92px}.disc-g svg{height:100%;width:auto}
.disc-n{font-family:var(--serif);font-size:24px;font-weight:700;margin-top:6px}
.disc-s{font-size:13px;color:var(--label2);margin-bottom:10px}

/* vie de l’accueil */
.hero .hg svg{animation:bob 5.5s ease-in-out 1.8s infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-1.2deg)}}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:var(--tint);opacity:.0;pointer-events:none;animation:float 9s ease-in-out infinite}
.hero::before{width:10px;height:10px;left:18%;bottom:40%;animation-delay:1s}
.hero::after{width:7px;height:7px;right:20%;bottom:48%;animation-delay:4.5s}
@keyframes float{0%{opacity:0;transform:translateY(20px)}20%{opacity:.25}80%{opacity:.12}100%{opacity:0;transform:translateY(-120px)}}
.stag .tile{animation:qzin .5s cubic-bezier(.2,.8,.2,1) both}
.stag .tile:nth-child(2){animation-delay:.05s}.stag .tile:nth-child(3){animation-delay:.1s}.stag .tile:nth-child(4){animation-delay:.15s}.stag .tile:nth-child(5){animation-delay:.2s}
.view.enter .duo-c{animation:qzin .5s cubic-bezier(.2,.8,.2,1) .1s both}
.view.enter .duo-c+.duo-c{animation-delay:.16s}
svg.pour .ice{animation:none}
svg.pour .ice>g,svg.pour .ice>circle{animation:drop .6s cubic-bezier(.3,1.35,.55,1) both}
svg.pour .ice>circle{animation-delay:.8s}
svg.pour .liq{transform-box:view-box;transform-origin:50% 90%;animation:pour 1.35s cubic-bezier(.22,.8,.25,1) .1s both}
@keyframes pour{0%{transform:translateY(62px) rotate(-5deg)}55%{transform:translateY(-1.5px) rotate(2.5deg)}78%{transform:translateY(.5px) rotate(-1deg)}100%{transform:none}}
/* ===== V5 : peaufinage ===== */
.sheet-head{position:absolute;top:0;left:0;right:0;z-index:6}
.sheet-head.titled{background:var(--bg)}
.sheet-body{padding-top:52px}
.dhero{margin-top:-52px}
.dhero .glow{background-blend-mode:normal}
.sheet.fresh .dhero h1{animation:vin .55s cubic-bezier(.2,.8,.2,1) .25s both}
.sheet.fresh .dhero .tags{animation:vin .55s cubic-bezier(.2,.8,.2,1) .32s both}
.sheet.fresh .facts{animation:vin .55s cubic-bezier(.2,.8,.2,1) .38s both}
.sheet.fresh .status,.sheet.fresh .rate-box{animation:vin .55s cubic-bezier(.2,.8,.2,1) .44s both}
.sheet.fresh .sheet-foot{animation:footin .5s cubic-bezier(.2,.8,.2,1) .3s both}
@keyframes footin{from{transform:translateY(100%)}to{transform:none}}
.tick-steps li{cursor:pointer;transition:color .25s}
.tick-steps li::after{transition:background .25s,color .25s,transform .3s cubic-bezier(.3,1.6,.5,1)}
.tick-steps li.done{color:var(--label2);text-decoration:line-through;text-decoration-color:var(--label3)}
.tick-steps li.done::after{content:"✓";background:var(--green);color:#fff;transform:scale(1.08)}
.bm-prog{display:flex;gap:4px;margin:2px 0 14px}
.bm-prog i{flex:1;height:4px;border-radius:2px;background:var(--fill);transition:background .3s}
.bm-prog i.done,.bm-prog i.now{background:var(--tint)}
.bm-prog i.now{animation:qzin .4s both}
.dhero .glow{filter:blur(2px)}
svg{min-width:0;min-height:0}
#toast{width:max-content;max-width:min(88%,360px);text-align:left}
#toast span{flex:1;min-width:0}
.sheet-head{transition:background .25s,box-shadow .25s}
.sheet-head.scrolled{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}

/* ===== V7 : ta version, lexique, sans alcool, vie ===== */
.adj{padding:6px 16px}
.adj-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.adj-row+.adj-row{border-top:.5px solid var(--sep)}
.adj-l b{display:block;font-size:16px}
.adj-l span{font-size:13px;color:var(--label2)}
.adj-dots{display:flex;align-items:center;gap:2px;flex:none;position:relative}
.adj-dots::before{content:"";position:absolute;left:14px;right:14px;top:50%;height:2px;margin-top:-1px;background:var(--fill);border-radius:1px}
.adj-dots button{width:28px;height:34px;display:grid;place-items:center;position:relative}
.adj-dots button i{width:10px;height:10px;border-radius:5px;background:var(--bg2);box-shadow:inset 0 0 0 2px var(--label3);transition:transform .3s cubic-bezier(.3,1.6,.5,1),background .2s,box-shadow .2s}
.adj-dots button.zero i{width:4px;height:12px;border-radius:2px;box-shadow:none;background:var(--label3)}
.adj-dots button.on i{width:18px;height:18px;border-radius:9px;background:var(--tint);box-shadow:0 2px 8px color-mix(in srgb,var(--tint) 45%,transparent)}
.adj-dots button.on.zero i{width:18px;height:18px;border-radius:9px;background:var(--label2)}
.adj-dots button.pop i{animation:spop .45s cubic-bezier(.3,1.8,.5,1)}
.delta{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;padding:1px 5px;border-radius:6px;vertical-align:1px;animation:spop .4s cubic-bezier(.3,1.8,.5,1)}
.delta.up{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.delta.down{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}
.ing-line .q{min-width:88px}
.bm-mine{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--tint);background:var(--tint-bg);border-radius:12px;padding:5px 10px;margin-top:14px}
.bm-mine svg{width:16px;height:16px}
.fb-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.fb-chips .chip{animation:qzin .4s cubic-bezier(.2,.8,.2,1) both}
.fb-chips .chip:nth-child(2){animation-delay:.04s}.fb-chips .chip:nth-child(3){animation-delay:.08s}.fb-chips .chip:nth-child(4){animation-delay:.12s}.fb-chips .chip:nth-child(5){animation-delay:.16s}.fb-chips .chip:nth-child(6){animation-delay:.2s}.fb-chips .chip:nth-child(7){animation-delay:.24s}

.term{font:inherit;color:inherit;background:none;padding:0;text-decoration:underline dotted;text-decoration-color:var(--tint);text-underline-offset:3px;text-decoration-thickness:1.5px;cursor:help}
.steps li.done .term{text-decoration-color:var(--label3)}
#pop{position:fixed;z-index:150;background:var(--bg2);color:var(--label);border-radius:16px;padding:12px 14px;box-shadow:0 12px 40px rgba(0,0,0,.25),0 0 0 .5px var(--sep);font-size:14px;line-height:1.4;opacity:0;transform:scale(.9);pointer-events:none;transition:opacity .2s,transform .3s cubic-bezier(.3,1.5,.5,1)}
#pop.show{opacity:1;transform:none;pointer-events:auto}
#pop.below{transform-origin:var(--ax) 0}#pop.above{transform-origin:var(--ax) 100%}
#pop b{display:block;font-size:15px;margin-bottom:3px;color:var(--tint)}
#pop span{color:var(--label2)}
#pop::before{content:"";position:absolute;left:var(--ax);width:12px;height:12px;background:var(--bg2);margin-left:-6px;transform:rotate(45deg)}
#pop.below::before{top:-5px}#pop.above::before{bottom:-5px}

.seg.small4 button{font-size:13px}
.na-banner{margin:4px 16px 4px;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--green) 16%,var(--bg2)),var(--bg2));box-shadow:var(--shadow)}
.na-banner b{display:block;font-family:var(--serif);font-size:18px}
.na-banner span{font-size:14px;color:var(--label2)}

/* segmentés : curseur qui glisse */
.seg{isolation:isolate}
.seg button.on{background:transparent!important;box-shadow:none!important}
.seg-thumb{position:absolute;top:2px;bottom:2px;left:2px;border-radius:7px;background:var(--bg2);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);transition:transform .38s cubic-bezier(.3,1.25,.5,1),width .38s cubic-bezier(.3,1.25,.5,1);z-index:0;pointer-events:none}
.seg button{position:relative;z-index:1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg-thumb{background:#5A544E}}
:root[data-theme="dark"] .seg-thumb{background:#5A544E}
/* onglets : pastille qui glisse */
.tabbar{position:fixed}
.tab-ind{position:absolute;top:5px;left:0;width:56px;height:30px;border-radius:15px;background:var(--tint-bg);transition:transform .45s cubic-bezier(.3,1.3,.5,1);pointer-events:none}
.tabbar button{position:relative;z-index:1}

/* feuilles : l'app recule comme sur iOS */
body{transition:background .4s}
body.sheet-open{background:#000}
#app,.tabbar{transition:transform .45s cubic-bezier(.2,.9,.25,1),border-radius .45s,filter .45s;transform-origin:50% 0}
body.sheet-open #app{transform:scale(.93) translateY(calc(env(safe-area-inset-top,0px) + 10px));border-radius:14px;overflow:hidden;filter:brightness(.85)}
body.sheet-open .tabbar{transform:translateY(100%)}
.backdrop{background:rgba(0,0,0,.18)}

/* verres vivants */
svg.live .wave{animation:wave 2.6s linear infinite}
@keyframes wave{to{transform:translateX(32px)}}
svg.pour .ice>g.cube{animation:drop .6s cubic-bezier(.3,1.35,.55,1) var(--d) both,icebob 4.5s ease-in-out calc(var(--d) + .7s + var(--b)) infinite}
svg.live:not(.pour) .ice>g.cube{animation:icebob 4.5s ease-in-out var(--b) infinite}
@keyframes icebob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
svg.pour .ice>g{animation:none}
svg.pour .ice>circle{animation:drop .6s cubic-bezier(.3,1.35,.55,1) .8s both}
svg.live .fz circle{animation:bub 2.6s ease-in infinite;animation-delay:calc(var(--i,0) * .3s)}
svg.live .fz circle:nth-child(2n){animation-duration:3.1s;animation-delay:.6s}
svg.live .fz circle:nth-child(3n){animation-duration:2.2s;animation-delay:1.1s}
svg.live .garn{transform-box:fill-box;transform-origin:50% 100%}
.jig svg{animation:jig .7s cubic-bezier(.3,1.6,.5,1)!important}
@keyframes jig{0%{transform:none}20%{transform:rotate(-7deg) scale(1.04)}45%{transform:rotate(5deg)}70%{transform:rotate(-2deg)}100%{transform:none}}
.hg,.dg{cursor:pointer}
.bubbles{position:fixed;inset:0;pointer-events:none;z-index:120}
.bubbles i{position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,.85);background:rgba(255,255,255,.18);animation:bubup 1.2s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes bubup{0%{transform:translate(0,0) scale(.4);opacity:0}20%{opacity:1}100%{transform:translate(var(--dx),-120px) scale(1);opacity:0}}
.hero .glow,.dhero .glow{animation:glowdrift 9s ease-in-out infinite}
@keyframes glowdrift{0%,100%{transform:scale(1)}50%{transform:scale(1.12) translateY(-8px)}}
.tile,.duo-c,.mini{transition:transform .25s cubic-bezier(.3,1.3,.5,1)}
@media (prefers-reduced-motion:reduce){svg.live *{animation:none!important}}
.btn.did{background:color-mix(in srgb,var(--green) 18%,transparent)!important;color:var(--green)!important;animation:spop .45s cubic-bezier(.3,1.8,.5,1)}
.btn.did svg{width:18px;height:18px}

/* ===== Lancement ===== */
#splash{position:fixed;inset:0;z-index:300;background:var(--bg);display:grid;place-items:center;overflow:hidden;transition:opacity .55s ease .05s}
#splash .sp-glow{position:absolute;width:140vmax;height:140vmax;left:50%;top:44%;margin:-70vmax 0 0 -70vmax;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 42%,transparent) 0%,transparent 42%);transform:scale(.2);opacity:0;animation:spglow 1.6s cubic-bezier(.2,.8,.2,1) .5s forwards}
@keyframes spglow{to{transform:scale(1);opacity:1}}
.sp-stage{position:relative;display:flex;flex-direction:column;align-items:center;transform:translateY(-4vh)}
.sp-glass{width:200px;height:auto;overflow:visible}
.sp-draw{stroke-dasharray:100;stroke-dashoffset:100;animation:spdraw .7s cubic-bezier(.6,0,.3,1) forwards}
.sp-draw.d2{animation-delay:.45s;animation-duration:.35s}.sp-draw.d3{animation-delay:.62s;animation-duration:.3s}
@keyframes spdraw{to{stroke-dashoffset:0}}
.sp-liq{transform:translateY(46px);animation:spfill 1s cubic-bezier(.25,.8,.25,1) .55s forwards}
@keyframes spfill{0%{transform:translateY(46px) rotate(-4deg)}60%{transform:translateY(-2px) rotate(2deg)}80%{transform:translateY(1px) rotate(-.8deg)}100%{transform:none}}
.sp-liq{transform-box:view-box;transform-origin:60px 60px}
.sp-wave{animation:spwave 1.2s linear infinite}.sp-wave2{animation:spwave 1.6s linear infinite}
@keyframes spwave{to{transform:translateX(30px)}}
.sp-bub circle{opacity:0;animation:spbub 1.4s ease-in infinite}
@keyframes spbub{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-26px);opacity:0}}
.sp-shine{opacity:0;animation:spfade .4s ease 1.2s forwards}
@keyframes spfade{to{opacity:1}}
.sp-lemon{animation:splemon .8s cubic-bezier(.3,1.35,.55,1) .9s both}
@keyframes splemon{0%{transform:translate(104px,-150px);opacity:0}25%{opacity:1}100%{transform:translate(102px,30px);opacity:1}}
.sp-spin{animation:spspin .75s cubic-bezier(.3,1.2,.55,1) .95s both}
@keyframes spspin{from{transform:rotate(-220deg)}to{transform:none}}
.sp-star{opacity:0;transform:scale(0);transform-box:view-box;animation:spstar .6s cubic-bezier(.3,1.8,.5,1) forwards}
@keyframes spstar{0%{opacity:0;transform:scale(0) rotate(-45deg)}60%{opacity:1;transform:scale(1.3)}100%{opacity:1;transform:scale(1) rotate(0)}}
.sp-title{font-family:var(--serif);font-weight:700;font-size:52px;letter-spacing:-.01em;margin-top:6px;display:flex}
.sp-title span{display:inline-block;opacity:0;transform:translateY(18px) scale(.8);animation:spletter .55s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes spletter{to{opacity:1;transform:none}}
.sp-sub{font-size:15px;color:var(--label2);font-weight:600;opacity:0;animation:vin .6s cubic-bezier(.2,.8,.2,1) 1.5s forwards}
#splash.out{opacity:0;pointer-events:none}
#splash.out .sp-stage{transition:transform .6s cubic-bezier(.5,0,.75,0),filter .6s;transform:translateY(-4vh) scale(2.6);filter:blur(6px)}

/* ===== V10 : ambiance selon l'heure ===== */
#app{z-index:1}
#ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.amb-sky{position:absolute;left:0;right:0;top:0;height:64vh;opacity:0;transition:opacity 1.5s}
:root[data-moment] .amb-sky{opacity:1}
:root[data-moment="matin"] .amb-sky{background:linear-gradient(180deg,#FFE0C4 0%,#FDEADB 38%,rgba(242,242,247,0) 100%)}
:root[data-moment="aprem"] .amb-sky{background:linear-gradient(180deg,#D4E8FB 0%,#E6F0FB 42%,rgba(242,242,247,0) 100%)}
:root[data-moment="apero"] .amb-sky{background:linear-gradient(180deg,#FFC486 0%,#FFD9AE 32%,#FBE8D6 58%,rgba(242,242,247,0) 100%)}
:root[data-moment="soir"] .amb-sky{background:linear-gradient(180deg,#E2C4EA 0%,#EEDCF1 42%,rgba(242,242,247,0) 100%)}
:root[data-moment="nuit"] .amb-sky{background:linear-gradient(180deg,#C2CBEA 0%,#DCE1F3 42%,rgba(242,242,247,0) 100%)}
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"])[data-moment="matin"] .amb-sky{background:linear-gradient(180deg,#3E2430 0%,#221418 45%,rgba(0,0,0,0) 100%)}
 :root:not([data-theme="light"])[data-moment="aprem"] .amb-sky{background:linear-gradient(180deg,#12283E 0%,#0A1622 45%,rgba(0,0,0,0) 100%)}
 :root:not([data-theme="light"])[data-moment="apero"] .amb-sky{background:linear-gradient(180deg,#5A2808 0%,#361606 35%,#1A0A04 60%,rgba(0,0,0,0) 100%)}
 :root:not([data-theme="light"])[data-moment="soir"] .amb-sky{background:linear-gradient(180deg,#34143E 0%,#1C0A22 45%,rgba(0,0,0,0) 100%)}
 :root:not([data-theme="light"])[data-moment="nuit"] .amb-sky{background:linear-gradient(180deg,#0C1640 0%,#060A20 45%,rgba(0,0,0,0) 100%)}
}
.amb-sun{position:absolute;border-radius:50%;opacity:0;transition:opacity 1.5s;pointer-events:none}
:root[data-moment="matin"] .amb-sun{opacity:1;width:260px;height:260px;left:-40px;top:2vh;background:radial-gradient(circle,rgba(255,236,190,.95) 0%,rgba(255,200,140,.35) 38%,rgba(255,200,140,0) 70%);animation:sunbreath 8s ease-in-out infinite}
:root[data-moment="aprem"] .amb-sun{opacity:1;width:200px;height:200px;right:-50px;top:-40px;background:radial-gradient(circle,rgba(255,250,225,1) 0%,rgba(255,236,160,.4) 35%,rgba(255,236,160,0) 70%);animation:sunbreath 10s ease-in-out infinite}
:root[data-moment="apero"] .amb-sun{opacity:1;width:340px;height:340px;left:calc(50% - 170px);top:14vh;background:radial-gradient(circle,rgba(255,200,110,.95) 0%,rgba(255,140,60,.45) 30%,rgba(255,120,40,0) 68%);animation:sunset 12s ease-in-out infinite}
:root[data-moment="soir"] .amb-sun{opacity:.9;width:160px;height:160px;right:-20px;top:4vh;background:radial-gradient(circle,rgba(240,225,255,.9) 0%,rgba(200,170,240,.3) 34%,rgba(200,170,240,0) 70%)}
:root[data-moment="nuit"] .amb-sun{opacity:1;width:120px;height:120px;right:10%;top:5vh;background:radial-gradient(circle,rgba(235,240,255,.95) 0%,rgba(180,200,255,.28) 30%,rgba(180,200,255,0) 70%)}
@keyframes sunbreath{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes sunset{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(10px) scale(1.06)}}
.amb-stars{position:absolute;inset:0;opacity:0;transition:opacity 1.5s}
:root[data-moment="nuit"] .amb-stars{opacity:1}
:root[data-moment="soir"] .amb-stars{opacity:.45}
.amb-stars i{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#fff;box-shadow:0 0 4px rgba(255,255,255,.8);animation:twinkle2 3.2s ease-in-out infinite}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .amb-stars i{background:#7A86C0;box-shadow:none}}
:root[data-theme="light"] .amb-stars i{background:#7A86C0;box-shadow:none}
@keyframes twinkle2{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.amb-stars .shoot{position:absolute;top:8vh;left:70%;width:90px;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff);opacity:0;transform:rotate(-24deg);animation:shoot 9s ease-in 3s infinite}
@keyframes shoot{0%,88%{opacity:0;transform:translate(0,0) rotate(-24deg)}90%{opacity:1}100%{opacity:0;transform:translate(-220px,100px) rotate(-24deg)}}
.amb-dust{position:absolute;inset:0;opacity:0;transition:opacity 1.5s}
:root[data-moment="apero"] .amb-dust{opacity:1}
:root[data-moment="matin"] .amb-dust{opacity:.5}
.amb-dust i{position:absolute;width:4px;height:4px;border-radius:50%;background:rgba(255,200,120,.85);box-shadow:0 0 6px rgba(255,190,100,.9);animation:dust 11s ease-in-out infinite}
@keyframes dust{0%{transform:translate(0,20px);opacity:0}20%{opacity:.9}80%{opacity:.6}100%{transform:translate(24px,-90px);opacity:0}}
.mo-eyebrow{display:flex;align-items:center;gap:7px;padding-right:20px}
.mo-ic{width:19px;height:19px;flex:none;display:grid}
.mo-ic svg{width:100%;height:100%}
.mo-matin{color:#E8903A}.mo-aprem{color:#E0AE20}.mo-apero{color:#F0702A}.mo-soir{color:#9A7AE0}.mo-nuit{color:#7A96F0}
.mo-aprem .rays{transform-origin:12px 12px;animation:spin 18s linear infinite}
.mo-matin .rays{animation:raypulse 2.6s ease-in-out infinite}
.mo-apero svg{animation:sunset 4s ease-in-out infinite}
.mo-nuit .tw{transform-box:fill-box;transform-origin:center;animation:twinkle2 2.2s ease-in-out infinite}.mo-nuit .tw.t2{animation-delay:1.1s}
@keyframes spin{to{transform:rotate(360deg)}}

.ck-burst{position:absolute;left:50%;top:calc(30% + 22px);width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:3px solid #fff;opacity:0;animation:ckburst .7s ease-out .55s both}
